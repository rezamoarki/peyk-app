function findCaesarBlockMatch(text){
  if(!text) return null;
  const norm = text.toLowerCase();
  for(const block of CAESAR_RESORT_BLOCKS){
    const variants = [block.name.toLowerCase()].concat((CAESAR_NAME_FA_VARIANTS[block.name] || []));
    if(variants.some(v => norm.includes(v.toLowerCase()))){
      return block;
    }
  }
  return null;
}

function seedCaesarResortBlocks(){
  const existing = getSavedLocations();
  const existingIds = new Set(existing.map(l => l.id));
  let addedCount = 0;
  const toAdd = [];
  CAESAR_RESORT_BLOCKS.forEach(b => {
    const id = 'loc_caesar_' + b.n;
    if(existingIds.has(id)) return;
    toAdd.push({
      id: id,
      name: 'سزار - بلاک ' + b.n + ' (' + b.name + ')',
      address: 'شهرک سزار (Caesar Resort) - فاز ' + b.phase + ' - بلاک شماره ' + b.n + ' - ' + b.name,
      mapLink: null,
      group: 'شهرک سزار ریسورت (Caesar Resort)',
      subGroup: 'فاز ' + b.phase,
      subGroupOrder: b.phase,
      sortKey: b.n
    });
    addedCount++;
  });
  setSavedLocations(existing.concat(toAdd));
  return addedCount;
}
 
function migrateCaesarLocationGroups(){
  const list = getSavedLocations();
  let changed = false;
  list.forEach(l => {
    if(l.id && l.id.indexOf('loc_caesar_') === 0 && !l.group){
      const n = parseInt(l.id.replace('loc_caesar_',''), 10);
      const block = CAESAR_RESORT_BLOCKS.find(b => b.n === n);
      if(block){
        l.group = 'شهرک سزار ریسورت (Caesar Resort)';
        l.subGroup = 'فاز ' + block.phase;
        l.subGroupOrder = block.phase;
        l.sortKey = block.n;
        changed = true;
      }
    }
  });
  if(changed) setSavedLocations(list);
}

function addUsage(inputTokens, outputTokens){
  const stats = getUsageStats();
  stats.count += 1;
  stats.inputTokens += inputTokens || 0;

  stats.costUSD += ((inputTokens||0)/1e6)*AI_PRICE_PER_MTOK_IN + ((outputTokens||0)/1e6)*AI_PRICE_PER_MTOK_OUT;
  localStorage.setItem('ai_usage_stats', JSON.stringify(stats));

function renderLocationsList(){
  const wrap = document.getElementById('locationsListWrap');
  if(!wrap) return;
  const q = (document.getElementById('locSearch').value || '').trim().toLowerCase();
  const all = getSavedLocations();
  const matches = (l) => !q ||
    (l.name || '').toLowerCase().includes(q) ||
    (l.address || '').toLowerCase().includes(q) ||
    (l.group || '').toLowerCase().includes(q) ||
    (l.subGroup || '').toLowerCase().includes(q);
  const list = all.filter(matches);
 
  if(list.length === 0){
    wrap.innerHTML = '<div class="empty">لوکیشنی پیدا نشد.</div>';
    return;
  }
 
  const grouped = {};
  const ungrouped = [];
  list.forEach(l => {
    if(l.group){
      if(!grouped[l.group]) grouped[l.group] = {};
      const sg = l.subGroup || 'سایر';
      if(!grouped[l.group][sg]) grouped[l.group][sg] = [];
      grouped[l.group][sg].push(l);
    } else {
      ungrouped.push(l);
    }
  });
 
  const hasSearch = !!q;
  let html = '';
 
  Object.keys(grouped).forEach(groupName => {
    const subGroups = grouped[groupName];
    let totalCount = 0;
    Object.values(subGroups).forEach(arr => totalCount += arr.length);
    const subGroupNames = Object.keys(subGroups).sort((a,b) => {
      const oa = subGroups[a][0].subGroupOrder != null ? subGroups[a][0].subGroupOrder : 0;
      const ob = subGroups[b][0].subGroupOrder != null ? subGroups[b][0].subGroupOrder : 0;
      return oa - ob;
    });
    html += `<details class="loc-group"${hasSearch ? ' open' : ''}>
      <summary>${escapeHtml(groupName)} (${totalCount})</summary>`;
    subGroupNames.forEach(sgName => {
      const items = subGroups[sgName].slice().sort((a,b) => (a.sortKey||0) - (b.sortKey||0));
      html += `<details class="loc-subgroup"${hasSearch ? ' open' : ''}>
        <summary>${escapeHtml(sgName)} (${items.length})</summary>
        ${items.map(locationCardHtml).join('')}
      </details>`;
    });
    html += `</details>`;
  });
 
  if(ungrouped.length > 0){
    if(Object.keys(grouped).length > 0){
      html += `<div class="section-label"><span>سایر لوکیشن‌ها (${ungrouped.length})</span></div>`;
    }
    html += ungrouped.map(locationCardHtml).join('');
  }
 
  wrap.innerHTML = html;
}

async function pasteLocationMapLink(){

      toast('کلیپ‌بورد خالیه — اول لوکیشن رو از واتس‌اپ کپی کن');
      return;

    const url = mapUrlFor(text);
    const looksLikeLink = /https?:\/\/\S+|(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/.test(text);

    }
    window._locFormMapLink = url;

function loadLocationPhotoFromBlob(blob){
  const statusEl = document.getElementById('locPhotoStatus');
  if(statusEl) statusEl.textContent = 'در حال آماده‌سازی عکس...';
  const reader = new FileReader();
  reader.onload = async () => {
    const originalDataUrl = reader.result;
    const wrap = document.getElementById('locPhotoPreviewWrap');
    if(wrap) wrap.innerHTML = `<img src="${originalDataUrl}" onclick="openImageLightbox(this.src)" style="cursor:zoom-in;">`;
    const resized = await resizeImageDataUrl(originalDataUrl, 1600);
    window._locFormPhotoMedia = resized.dataUrl.startsWith('data:image/jpeg') ? 'image/jpeg' : (blob.type || 'image/jpeg');
    window._locFormPhotoBase64 = resized.dataUrl.split(',')[1];
    const aiBtn = document.getElementById('locAiReadBtn');
    if(aiBtn) aiBtn.disabled = false;
 
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      let imageData = null;
      try{ imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }catch(e){}
      const result = await detectQrCode(canvas, imageData);
      if(result){
        window._locFormMapLink = result;
        const mapStatusEl = document.getElementById('locMapLinkStatus');
        if(mapStatusEl){ mapStatusEl.textContent = 'لینک نقشه از QR عکس ثبت شد ✓'; mapStatusEl.style.color = 'var(--teal)'; }
        if(statusEl) statusEl.textContent = 'عکس آماده‌ست، QR هم پیدا شد ✓';
      } else {
        if(statusEl) statusEl.textContent = 'عکس آماده‌ست (QR ای توش پیدا نشد)';
      }
    };
    img.src = resized.dataUrl;
  };
  reader.readAsDataURL(blob);
}
 
function onLocationPhotoSelected(evt){
  const file = evt.target.files[0];
  if(!file) return;
  loadLocationPhotoFromBlob(file);
}
 
async function pasteLocationPhoto(){
  if(!navigator.clipboard || !navigator.clipboard.read){
    toast('این مرورگر از چسباندن عکس پشتیبانی نمی‌کنه');
    return;
  }
  try{
    const items = await navigator.clipboard.read();
    let found = null;
    for(const item of items){
      const imgType = item.types.find(t => t.startsWith('image/'));
      if(imgType){ found = await item.getType(imgType); break; }
    }
    if(!found){
      toast('عکسی توی کلیپ‌بورد پیدا نشد');
      return;
    }
    loadLocationPhotoFromBlob(found);
  }catch(e){
    toast('اجازه دسترسی به کلیپ‌بورد داده نشد');
  }
}

  try{
    let parsed;
    if(geminiKey){

          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: { type:"OBJECT", properties: { name:{type:"STRING"}, address:{type:"STRING"} } }
          }
        })
      });
      if(!response.ok) throw new Error('gemini-' + response.status);
      const data = await response.json();
      const rawText = data.candidates && data.candidates[0] && data.candidates[0].content &&
        data.candidates[0].content.parts && data.candidates[0].content.parts[0] ?
        data.candidates[0].content.parts[0].text : '';
      parsed = JSON.parse(rawText);
    } else {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json", "x-api-key": claudeKey,
          "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6", max_tokens: 500,
          messages: [{ role: "user", content: [
            { type: "image", source: { type:"base64", media_type: window._locFormPhotoMedia, data: window._locFormPhotoBase64 } },
            { type: "text", text: prompt + '\n\nفقط JSON خام برگردون، بدون ```.' }
          ]}]
        })
      });
      if(!response.ok) throw new Error('claude-' + response.status);
      const data = await response.json();
      const textBlock = (data.content || []).find(c => c.type === 'text');
      let raw = textBlock ? textBlock.text : '';
      raw = raw.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(raw);
      if(data.usage) addUsage(data.usage.input_tokens, data.usage.output_tokens);
    }
 
    if(parsed.name && !document.getElementById('loc_name').value.trim()){
      document.getElementById('loc_name').value = parsed.name;
    }
    if(parsed.address){
      const addrField = document.getElementById('loc_address');
      addrField.value = addrField.value.trim() ? (addrField.value.trim() + '\n' + parsed.address) : parsed.address;
    }
    statusEl.textContent = 'آدرس از عکس خونده شد ✓ — بررسی کن';
  }catch(e){
    statusEl.textContent = 'خطا در خواندن آدرس از عکس، دستی بنویس';
  }
  btn.disabled = false;
}

let qrScanStream = null;
let qrScanRafId = null;
let qrScanCallback = null;
let qrScanSkipCallback = null;
let qrScanStarting = false;
 
let nativeBarcodeDetector = null;
function hasNativeBarcodeDetector(){
  return typeof BarcodeDetector !== 'undefined';
}
function getBarcodeDetector(){
  if(!nativeBarcodeDetector){
    nativeBarcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
  }
  return nativeBarcodeDetector;
}
 
async function detectQrCode(canvas, imageData){
  if(hasNativeBarcodeDetector()){
    try{
      const results = await getBarcodeDetector().detect(canvas);
      if(results && results.length > 0 && results[0].rawValue){
        return results[0].rawValue;
      }
      return null;
    }catch(e){
      // fall through to jsQR below if native detector errors out
    }
  }
  if(typeof jsQR !== 'undefined' && imageData){
    try{
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      return (code && code.data) ? code.data : null;
    }catch(e){
      return null;
    }
  }
  return null;
}
 
function captureQrViaPhoto(onDetected, onSkip){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.style.display = 'none';
  document.body.appendChild(input);
 
  const cleanup = () => { if(input.parentNode) input.parentNode.removeChild(input); };
 
  input.onchange = async () => {
    const file = input.files[0];
    cleanup();
    if(!file){ if(onSkip) onSkip(); return; }
    toast('در حال بررسی عکس برای QR...');
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        let imageData = null;
        try{ imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }catch(e){}
        const result = await detectQrCode(canvas, imageData);
        if(result){
          toast('QR شناسایی شد ✓');
          onDetected(result);
        } else {
          toast('QR پیدا نشد، دوباره امتحان کن یا دستی وارد کن');
          if(onSkip) onSkip();
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
 
async function startQrScanner(onDetected, options){
  options = options || {};
  if(qrScanStream || qrScanStarting){
    return;
  }
  qrScanStarting = true;
  qrScanCallback = onDetected;
  qrScanSkipCallback = options.onSkip || null;
  if(typeof jsQR === 'undefined' && !hasNativeBarcodeDetector()){
    toast('اسکنر QR در دسترس نیست (نه مرورگر پشتیبانی می‌کنه، نه کتابخانه لود شد)');
    qrScanStarting = false;
    if(qrScanSkipCallback){ const cb = qrScanSkipCallback; qrScanSkipCallback = null; cb(); }
    return;
  }
  const canUseLiveCamera = window.isSecureContext !== false && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  if(!canUseLiveCamera){
    qrScanStarting = false;
    const cb = qrScanCallback;
    const skipCb = qrScanSkipCallback;
    qrScanCallback = null;
    qrScanSkipCallback = null;
    toast('دوربین زنده روی فایل محلی در دسترس نیست، عکس بگیر');
    captureQrViaPhoto(cb, skipCb);
    return;
  }
 
  const root = document.getElementById('modalRoot');
  root.insertAdjacentHTML('beforeend', `
  <div class="qr-scan-overlay" id="qrScanOverlay">
    <div class="qr-scan-video-wrap">
      <video id="qrScanVideo" autoplay playsinline muted></video>
      <div class="qr-scan-frame"></div>
      <div class="qr-scan-status" id="qrScanStatusText">در حال باز کردن دوربین...</div>
    </div>
    <div class="qr-scan-bar">
      ${options.allowSkip ? `<button onclick="skipQrScanner()" style="background:var(--card2);color:var(--text);border:1px solid var(--line);">رسید QR نداره، ورود دستی</button>` : ''}
      <button onclick="stopQrScanner()">لغو</button>
    </div>
  </div>`);
 
  try{
    qrScanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    toast('اجازه دسترسی به دوربین داده نشد');
    qrScanStarting = false;
    const skipCb = qrScanSkipCallback;
    stopQrScanner();
    if(skipCb) skipCb();
    return;
  }
  qrScanStarting = false;
 
  const video = document.getElementById('qrScanVideo');
  if(!video){
    stopQrScanner();
    return;
  }
  video.srcObject = qrScanStream;
  try{
    await video.play();
  }catch(e){
    // some browsers throw if play() races with pause(); scanning still proceeds once frames arrive
  }
  const statusEl0 = document.getElementById('qrScanStatusText');
  if(statusEl0) statusEl0.textContent = 'دوربین رو روی QR کد پایین رسید بگیر...';
 
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let frameBusy = false;
 
  const scanFrame = async () => {
    if(!qrScanStream) return;
    if(!frameBusy && video.readyState === video.HAVE_ENOUGH_DATA){
      frameBusy = true;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let imageData = null;
      try{ imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }catch(e){}
      const result = await detectQrCode(canvas, imageData);
      frameBusy = false;
      if(result){
        const cb = qrScanCallback;
        stopQrScanner();
        toast('QR شناسایی شد ✓');
        if(cb) cb(result);
        return;
      }
    }
    qrScanRafId = requestAnimationFrame(scanFrame);
  };
  qrScanRafId = requestAnimationFrame(scanFrame);
}
 
function stopQrScanner(){
  qrScanStarting = false;
  if(qrScanRafId){ cancelAnimationFrame(qrScanRafId); qrScanRafId = null; }
  if(qrScanStream){ qrScanStream.getTracks().forEach(t => t.stop()); qrScanStream = null; }
  document.querySelectorAll('#qrScanOverlay').forEach(el => el.remove());
  qrScanCallback = null;
  qrScanSkipCallback = null;
}
 
function skipQrScanner(){
  const cb = qrScanSkipCallback;
  stopQrScanner();
  if(cb) cb();
}

function normalizePhone(p){
  return String(p || '').replace(/\D/g, '');
}
function isRestaurantPhone(p){
  const n = normalizePhone(p);
  if(!n) return false;
  return RESTAURANT_PHONE_BLACKLIST.some(bl => n.endsWith(bl) || bl.endsWith(n));
}
 
async function getCustomerAddressHistory(phone){
  const normPhone = normalizePhone(phone);
  if(!normPhone || normPhone.length < 6 || isRestaurantPhone(phone)) return [];
  const results = [];
  try{
    const listRes = await localStore.list(STORAGE_KEY_PREFIX);
    const keys = listRes && listRes.keys ? listRes.keys : [];
    for(const k of keys){
      try{
        const r = await localStore.get(k);
        const orders = r ? JSON.parse(r.value) : [];
        orders.forEach(o => {
          if(o.phone && !isRestaurantPhone(o.phone) && normalizePhone(o.phone) === normPhone && (o.address || '').trim()){
            results.push({ address: o.address, mapLink: o.mapLink || null, name: o.name || '', date: k.replace(STORAGE_KEY_PREFIX,''), time: o.time || '' });
          }
        });
      }catch(e){}
    }
  }catch(e){}
  results.sort((a,b) => (a.date + a.time) < (b.date + b.time) ? 1 : -1);
  const seen = new Set();
  const unique = [];
  results.forEach(h => {
    const key = h.address.trim().toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    unique.push(h);
  });
  return unique;
}
 
function timeStringToMinutes(hhmm){
  if(!hhmm) return null;
  const m = String(hhmm).match(/(\d{1,2})[:.](\d{2})/);
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  if(h > 23 || mi > 59) return null;
  return h*60 + mi;
}
 
function nowMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
 
function minutesToDisplayTime(mins){
  const d = new Date();
  d.setHours(Math.floor(mins/60), mins%60, 0, 0);
  return d.toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' });
}
 
function currencySymbol(code){
  const c = CURRENCIES.find(x => x.code === code);
  return c ? c.symbol : '';
}
 
function getOrderPayments(o){
  if(o.payments && o.payments.length) return o.payments;
  if(o.payment) return [o.payment];
  return [];

function getOrderMismatch(o){
  if(o.paymentMismatch != null) return o.paymentMismatch;
  if(o.payment && o.payment.mismatch != null) return o.payment.mismatch;
  return null;
}
 
function render(){
  const dl = document.getElementById('dateLabel');
  dl.textContent = new Date().toLocaleDateString('fa-IR', { weekday:'long', day:'numeric', month:'long' });
  const vl = document.getElementById('versionLabel');
  if(vl) vl.textContent = 'نسخه ' + APP_VERSION;
 
  const pending = currentOrders.filter(o => o.status !== 'delivered').sort((a,b) => (a.priority||0) - (b.priority||0));
  const delivered = currentOrders.filter(o => o.status === 'delivered');
 
  let cashTotal = 0, cardTotal = 0, transferTotal = 0;
  const forexTotals = {};
  delivered.forEach(o => {
    getOrderPayments(o).forEach(p => {
      if(p.method === 'نقد') cashTotal += Number(p.amountTL) || 0;
      else if(p.method === 'کارت') cardTotal += Number(p.amountTL) || 0;
      else if(p.method === 'واریز') transferTotal += Number(p.amountTL) || 0;
      else if(p.method === 'ارز'){
        forexTotals[p.currency] = (forexTotals[p.currency] || 0) + (Number(p.currencyAmount) || 0);
      }
    });
  });
  const tlTotal = cashTotal + cardTotal + transferTotal;
 
  document.getElementById('statQueue').textContent = pending.length;
  document.getElementById('statDelivered').textContent = delivered.length;
  document.getElementById('statTotal').textContent = fmt(tlTotal);
 
  const forexNote = document.getElementById('forexNote');
  const forexKeys = Object.keys(forexTotals);
  if(forexKeys.length){
    forexNote.style.display = 'block';
    forexNote.textContent = 'ارز خارجی: ' + forexKeys.map(k => fmt(forexTotals[k]) + currencySymbol(k)).join(' | ');
  } else {
    forexNote.style.display = 'none';
  }
 
  const main = document.getElementById('mainContent');
  let html = '';
 
  if(pending.length === 0 && delivered.length === 0){
    html += '<div class="empty" style="margin-top:14px;">هنوز سفارشی ثبت نشده. با دکمه پایین شروع کن.</div>';
  }
 
  if(pending.length > 0){
    const active = pending[0];
    html += '<div class="section-label"><span>در حال تحویل</span></div>';
    html += activeOrderCard(active);
 
    const rest = pending.slice(1);
    if(rest.length > 0){
      html += '<div class="section-label"><span>صف بعدی (' + rest.length + ')</span></div>';
      html += rest.map((o, i) => queueOrderCard(o, i, rest.length)).join('');
    }
  }
 
  if(delivered.length > 0){
    html += '<div class="section-label"><span>تحویل داده‌شده امروز (' + delivered.length + ')</span></div>';
    html += delivered.slice().reverse().map(o => deliveredOrderCard(o)).join('');
  }
 
  main.innerHTML = html;
}
 
function paymentBadge(o){
  const payments = getOrderPayments(o);
  if(payments.length === 0) return '<span class="badge pending">در انتظار پرداخت</span>';
  const classMap = { 'نقد':'cash', 'کارت':'card', 'واریز':'transfer', 'ارز':'forex', 'آنلاین':'online', 'تیپ':'online' };
  let base = payments.map(p => {
    const cls = classMap[p.method] || 'src';
    const amtTxt = p.method === 'ارز' ? (fmt(p.currencyAmount) + currencySymbol(p.currency))
      : p.method === 'آنلاین' ? 'قبلاً پرداخت شده'
      : (fmt(p.amountTL) + ' TL');
    return `<span class="badge ${cls}">${escapeHtml(p.method)} · ${amtTxt}</span>`;
  }).join(' ');
  const mismatch = getOrderMismatch(o);
  if(mismatch){
    const sign = mismatch > 0 ? '+' : '';
    base += ' <span class="badge" style="background:#FCEBEB;color:#791F1F;">اختلاف ' + sign + fmt(mismatch) + ' TL</span>';
  }
  return base;
}

async function moveOrderPriority(id, dir){
  const pending = currentOrders.filter(o => o.status !== 'delivered').sort((a,b) => (a.priority||0) - (b.priority||0));
  const idx = pending.findIndex(o => o.id === id);
  const swapIdx = idx + dir;
  if(idx < 0 || swapIdx < 0 || swapIdx >= pending.length) return;
  const tmp = pending[idx].priority;
  pending[idx].priority = pending[swapIdx].priority;
  pending[swapIdx].priority = tmp;
  await saveOrders();
  render();
}
 
function startMovingToOrder(orderId, app){
  const idx = currentOrders.findIndex(o => o.id === orderId);
  if(idx === -1) return;
  if(!currentOrders[idx].startedMovingAt){
    currentOrders[idx].startedMovingAt = Date.now();
    saveOrders();
  }
  const o = currentOrders[idx];
  const target = o.mapLink || o.address || '';
  if(app === 'waze') openWaze(target);
  else if(app === 'google') openGoogleMapsExplicit(target);
  else openMap(target);
}
 
function scanQrForOrder(orderId){

    const idx = currentOrders.findIndex(x => x.id === orderId);
    if(idx === -1) return;
    currentOrders[idx] = { ...currentOrders[idx], mapLink: link };
    await saveOrders();
    render();
    openMap(link);
  });
}
 
function recordArrivalLocation(orderId){
  if(!navigator.geolocation){
    toast('موقعیت‌یابی روی این مرورگر در دسترس نیست');
    return;
  }
  toast('در حال گرفتن موقعیت دقیق...');
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const accuracy = Math.round(pos.coords.accuracy || 0);
      const link = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
 
      const idx = currentOrders.findIndex(x => x.id === orderId);
      if(idx === -1) return;
      currentOrders[idx] = { ...currentOrders[idx], mapLink: link, arrivalLat: lat, arrivalLng: lng };
      await saveOrders();
      render();
      toast('موقعیت دقیق ثبت شد (± ' + accuracy + ' متر)');
      offerSaveArrivalAsLocation(currentOrders[idx]);
    },
    (err) => {
      let msg = 'خطا در گرفتن موقعیت';
      if(err.code === 1) msg = 'اجازه دسترسی به موقعیت مکانی داده نشد';
      else if(err.code === 2) msg = 'موقعیت مکانی در دسترس نیست (GPS رو چک کن)';
      else if(err.code === 3) msg = 'زمان گرفتن موقعیت تموم شد، دوباره امتحان کن';
      toast(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function simpleHash(str){
  let h1 = 0, h2 = 0;
  const len = str.length;
  const step = Math.max(1, Math.floor(len / 4000));
  for(let i=0;i<len;i+=step){
    const c = str.charCodeAt(i);
    h1 = (h1 * 31 + c) | 0;
    h2 = (h2 * 131 + c) | 0;
  }
  return len + '_' + h1 + '_' + h2;
}
 
function findDuplicateOrder(){
  const excludeId = editingId;
  const orderNoVal = (document.getElementById('f_orderno') && document.getElementById('f_orderno').value.trim()) || '';
  const amountVal = Number((document.getElementById('f_amount') && document.getElementById('f_amount').value.replace(/[^0-9.]/g,'')) || 0);
  const phoneValRaw = (document.getElementById('f_phone') && document.getElementById('f_phone').value.trim()) || '';
  const phoneVal = isRestaurantPhone(phoneValRaw) ? '' : normalizePhone(phoneValRaw);
 
  for(const o of currentOrders){
    if(o.id === excludeId) continue;
    if(capturedPhotoHash && o.photoHash && o.photoHash === capturedPhotoHash) return { order: o, reason: 'همین عکس رسید قبلاً ثبت شده' };
    if(orderNoVal && o.orderNo && o.orderNo === orderNoVal) return { order: o, reason: 'شماره سفارش تکراریه' };
    const oPhone = isRestaurantPhone(o.phone) ? '' : normalizePhone(o.phone);
    if(amountVal > 0 && phoneVal && oPhone && Number(o.amount) === amountVal && oPhone === phoneVal) return { order: o, reason: 'مبلغ و تلفن با یک سفارش دیگه یکیه' };
  }
  return null;
}

function resizeImageDataUrl(dataUrl, maxDim){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if(width <= maxDim && height <= maxDim){
        resolve({ dataUrl, width, height });
        return;
      }
      const scale = Math.min(maxDim / width, maxDim / height);
      const newW = Math.round(width * scale);
      const newH = Math.round(height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = newW;
      canvas.height = newH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, newW, newH);
      resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.85), width: newW, height: newH });
    };
    img.onerror = () => resolve({ dataUrl, width: null, height: null });
    img.src = dataUrl;
  });
}
 
async function loadPhotoFromBlob(blob){

    const resized = await resizeImageDataUrl(originalDataUrl, 1600);
    const finalDataUrl = resized.dataUrl;
    capturedImageMedia = finalDataUrl.startsWith('data:image/jpeg') ? 'image/jpeg' : (blob.type || 'image/jpeg');
    capturedImageBase64 = finalDataUrl.split(',')[1];
    capturedPhotoHash = simpleHash(capturedImageBase64);

  reader.readAsDataURL(blob);
}
 
async function pastePhotoFromClipboard(){

    return;
  }
  try{
    const items = await navigator.clipboard.read();
    let found = null;
    for(const item of items){
      const imgType = item.types.find(t => t.startsWith('image/'));
      if(imgType){
        found = await item.getType(imgType);
        break;
      }
    }
    if(!found){
      toast('عکسی توی کلیپ‌بورد پیدا نشد، اول عکس رو کپی کن');
      return;
    }
    loadPhotoFromBlob(found);
    toast('عکس چسبانده شد');
  }catch(e){
    toast('اجازه دسترسی به کلیپ‌بورد داده نشد');

}

function decodeQrFromImage(dataUrl){
  const img = new Image();
  img.onload = async () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    let imageData = null;
    try{ imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }catch(e){}
    const result = await detectQrCode(canvas, imageData);
    const statusEl = document.getElementById('qrStatus');
    if(result){
      capturedQrLink = result;
      if(statusEl) statusEl.innerHTML = 'لینک نقشه از QR کد خونده شد ✓';
    } else {
      if(statusEl) statusEl.textContent = 'QR کدی روی این عکس پیدا نشد';
    }
  };
  img.src = dataUrl;
}

function extractLatLngFromMapLink(link){
  if(!link) return null;
  const m = String(link).match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if(!m) return null;
  return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
}
 
function buildKmlFromLocations(locations){
  const esc = (s) => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const placemarks = locations.map(l => {
    const coords = extractLatLngFromMapLink(l.mapLink);
    const pointXml = coords ? `<Point><coordinates>${coords.lng},${coords.lat},0</coordinates></Point>` : '';
    const folder = l.group || 'سایر لوکیشن‌ها';
    return { folder, xml: `<Placemark>
      <name>${esc(l.name)}</name>
      <description>${esc(l.address || '')}${l.mapLink && !coords ? ' | لینک نقشه: ' + esc(l.mapLink) : ''}</description>
      ${pointXml}
    </Placemark>` };
  });
  const folders = {};
  placemarks.forEach(p => {
    if(!folders[p.folder]) folders[p.folder] = [];
    folders[p.folder].push(p.xml);
  });
  const folderXml = Object.keys(folders).map(name =>
    `<Folder><name>${esc(name)}</name>${folders[name].join('\n')}</Folder>`
  ).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
<name>پیک سوشین - لوکیشن‌های ذخیره‌شده</name>
${folderXml}
</Document>
</kml>`;
}
 
function exportLocationsKml(){

  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });

  const a = document.createElement('a');
  a.href = url;
  a.download = 'peyk-locations.kml';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(withCoords + ' از ' + locations.length + ' تا با پین دقیق، بقیه فقط متنی — توی Map Marker وارد کن');
}
 
function mapUrlFor(text){
  const t = (text || '').trim();

  const urlMatch = t.match(/https?:\/\/\S+/);

    return urlMatch[0];
  }
  const coordMatch = t.match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if(coordMatch){
    return 'https://www.google.com/maps/search/?api=1&query=' + coordMatch[1] + ',' + coordMatch[2];
  }
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t);
}

function parseReceiptText(text){
  const out = { name:'', address:'', phone:'', amount:'', orderNo:'', source:'', orderTime:'', foundCount:0 };
  if(!text) return out;
  const norm = text.replace(/\r/g,'');
  const lines = norm.split('\n').map(l => l.trim()).filter(Boolean);
  const lower = norm.toLowerCase();
 
  const feedMeTimeMatch = norm.match(/Sip\.?\s*Zaman[ıi][:\s]*[\d.]+\s*\((\d{1,2}:\d{2})\)/i);
  const rioverdeTimeMatch = norm.match(/SAAT[:\s]*(\d{1,2}:\d{2})/i);
  const timeMatch = feedMeTimeMatch || rioverdeTimeMatch;
  if(timeMatch){ out.orderTime = timeMatch[1]; out.foundCount++; }
 
  if(lower.includes('feed me') || lower.includes('sushinn')){
    out.source = 'Feed Me';
  } else if(lower.includes('rioverde') || lower.includes('masa') || lower.includes('garson')){
    out.source = 'تلفن رستوران';
  }
 
  const phoneMatch = norm.match(/Telefon[:\s]*([+\d][\d\s()+-]{7,20})/i);
  if(phoneMatch){ out.phone = phoneMatch[1].replace(/\s+/g,' ').trim(); out.foundCount++; }
 
  const orderNoMatch = norm.match(/Sip\.?\s*No[:\s]*([A-Za-z0-9]{4,10})/i);
  if(orderNoMatch){ out.orderNo = orderNoMatch[1].trim(); out.foundCount++; }
 
  const faturaMatch = norm.match(/Fatura[:\s]*([\d.,]+)\s*TL/i);
  const kalanMatch = norm.match(/Kalan\s*Odeme\D{0,10}([\d.,]+)/i);
  const amtMatch = faturaMatch || kalanMatch;
  if(amtMatch){
    const raw = amtMatch[1].trim();
    const num = raw.includes(',') ? raw.replace(/\./g,'').replace(',', '.') : raw;
    out.amount = Math.round(parseFloat(num)) || '';
    if(out.amount) out.foundCount++;
  }
 
  const adresIdx = lines.findIndex(l => /^Adres/i.test(l));
  if(adresIdx > -1){
    let addrLines = [lines[adresIdx].replace(/^Adres[:\s]*/i,'')];
    for(let i=adresIdx+1;i<lines.length && i<adresIdx+5;i++){
      if(/Ürün|Urun|Fatura|Not:|Ödeme|Odeme|Feed Me/i.test(lines[i])) break;
      addrLines.push(lines[i]);
    }
    out.address = addrLines.join(' ').trim();
    if(out.address) out.foundCount++;
  }
 
  const telIdx = lines.findIndex(l => /^Telefon/i.test(l));
  if(telIdx > 0){
    const candidate = lines[telIdx-1];
    if(candidate && !/^-+$/.test(candidate) && candidate.length < 40){
      out.name = candidate;
      out.foundCount++;
    }
  }
 
  if(!out.name){
    const masaMatch = norm.match(/MASA\s*[:\s]*(\d+)/i);
    if(masaMatch){
      out.name = 'Masa ' + masaMatch[1];
      out.foundCount++;
    }
  }
 
  return out;
}
 
function buildReceiptPrompt(){
  const qrNote = capturedQrLink ? `\nیک لینک از QR کد این رسید خونده شده: "${capturedQrLink}" — اگر این لینک آدرس گوگل مپ بود، همون رو به عنوان لینک نقشه در نظر بگیر و توی فیلد address هم آدرس خوانا (متنی) رو از روی خود رسید بنویس، نه لینک رو.` : '';
  const phoneNote = `\nمهم: در انتهای رسیدهای "Feed Me" همیشه دو شماره ثابت خود رستوران به عنوان اطلاعات تماس چاپ شده (چیزی شبیه +90 (539) 124 66 24 و +90 (539) 122 66 24). این‌ها شماره مشتری نیستن، اصلاً در فیلد phone نذارشون. شماره واقعی مشتری همیشه بلافاصله زیر "Telefon:" و بالای بخش "Adres:" نوشته شده، همون رو بردار.`;
  const masaNote = `\nمهم: رسیدهای داخلی "RIOVERDE" اسم مشتری ندارن، فقط یه شماره "MASA" دارن (مثلاً MASA :413). برای این نوع رسید، فیلد name رو اینطوری بساز: "Masa " + همون عدد (مثلاً "Masa 413") — نه خالی بذار، نه چیز دیگه‌ای بنویس.`;

  return `این عکس یک رسید سفارش رستوران سوشی (به ترکی) است. دو نوع رسید ممکن است باشد: رسیدهای "Feed Me" که شامل نام مشتری، Telefon، Adres، Ürün و Fatura (مبلغ نهایی) است، یا رسید داخلی رستوران "RIOVERDE" که شامل Genel Toplam / Kalan Odeme به عنوان مبلغ نهایی است و ممکن است شماره تلفن یا آدرس با خط دست روی آن نوشته شده باشد.${qrNote}${phoneNote}${masaNote}${timeNote}
نوع پرداخت را استخراج نکن، چون قابل اعتماد نیست و بعداً موقع تحویل توسط پیک ثبت می‌شود.
اطلاعات زیر را استخراج کن و فقط یک JSON خام (بدون توضیح، بدون markdown) با این کلیدها برگردان:

اگر مبلغی به صورت دست‌نویس یا در پایین رسید نوشته شده (مثل Yalnız ... 'dir) همان را به عنوان مبلغ نهایی در نظر بگیر. آدرس یا تلفن دست‌نویس را هم اگر بود لحاظ کن. فقط JSON خام برگردان.`;
}
 
function applyExtractedFields(parsed){
  if(parsed.orderTime){
    const mins = timeStringToMinutes(parsed.orderTime);
    if(mins != null) capturedReceiptTime = mins;
  }
  if(parsed.name) document.getElementById('f_name').value = parsed.name;
  if(parsed.address) document.getElementById('f_address').value = parsed.address;
  if(parsed.phone) document.getElementById('f_phone').value = parsed.phone;
  if(parsed.amount) document.getElementById('f_amount').value = Math.round(Number(parsed.amount));
  if(parsed.notes) document.getElementById('f_notes').value = parsed.notes;
  if(parsed.orderNo) document.getElementById('f_orderno').value = parsed.orderNo;
  if(parsed.items) document.getElementById('f_items').value = parsed.items;
  if((parsed.orderNo || parsed.items) && document.getElementById('moreDetailsSection')) document.getElementById('moreDetailsSection').open = true;
  if(parsed.source){
    document.querySelectorAll('#srcGroup .chip').forEach(b=>{
      b.classList.toggle('active', b.dataset.val === parsed.source);
    });
  }
  showDuplicateWarning(findDuplicateOrder());
  checkCaesarBlockMatch();
  scheduleCustomerCheck();
}
 
const GEMINI_SCHEMA = {
  type: "OBJECT",
  properties: {
    name: { type: "STRING" },
    address: { type: "STRING" },
    phone: { type: "STRING" },
    amount: { type: "NUMBER" },
    source: { type: "STRING" },

  }
};
 
async function runGeminiExtract(){
  if(!capturedImageBase64) return;
  const statusEl = document.getElementById('aiStatus');
  const btn = document.getElementById('geminiBtn');
 
  const apiKey = getGeminiKey();
  if(!apiKey){
    statusEl.innerHTML = '⚠ اول یه کلید Gemini توی «تنظیمات» ذخیره کن.';
    return;
  }
 
  btn.disabled = true;
  statusEl.textContent = 'در حال خواندن با Gemini...';
 
  try{
    const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey
      },
      body: JSON.stringify({
        contents: [{
          parts: [
            { inline_data: { mime_type: capturedImageMedia, data: capturedImageBase64 } },
            { text: buildReceiptPrompt() }
          ]
        }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: GEMINI_SCHEMA
        }
      })
    });
 
    if(!response.ok){
      if(response.status === 401 || response.status === 403){
        statusEl.innerHTML = '⚠ کلید Gemini نامعتبره، توی تنظیمات چکش کن.';
      } else if(response.status === 429){
        statusEl.textContent = 'محدودیت رایگان امروز پر شده، چند لحظه صبر کن یا فردا دوباره امتحان کن.';
      } else if(response.status === 404){
        statusEl.innerHTML = '⚠ گوگل این مدل رو تغییر داده (نه مشکل کلید تو). به کلود بگو رفعش کنه.';
      } else if(response.status === 400){
        statusEl.textContent = 'درخواست رد شد (400) — یا کلید اشتباهه یا عکس مشکل داره.';
      } else {
        statusEl.textContent = 'خطا در سرور Gemini (' + response.status + ')، دستی وارد کن.';
      }
      btn.disabled = false;
      return;
    }
 
    const data = await response.json();
    const rawText = data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] ?
      data.candidates[0].content.parts[0].text : '';
    const parsed = JSON.parse(rawText);
    applyExtractedFields(parsed);
    statusEl.textContent = 'خونده شد (Gemini، رایگان)، لطفا بررسی و تایید کن.';
  }catch(e){
    statusEl.textContent = 'خطا در اتصال (اینترنت رو چک کن)، دستی وارد کن.';
  }
  btn.disabled = false;
}
 
async function runAiExtract(){
  if(!capturedImageBase64) return;
  const statusEl = document.getElementById('aiStatus');
  const aiBtn = document.getElementById('aiBtn');
 
  const apiKey = getApiKey();
  if(!apiKey){
    statusEl.innerHTML = '⚠ اول یه کلید API توی «تنظیمات» ذخیره کن.';
    return;
  }
 
  aiBtn.disabled = true;
  statusEl.textContent = 'در حال خواندن رسید...';
 
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: capturedImageMedia, data: capturedImageBase64 } },
            { type: "text", text: buildReceiptPrompt() }
          ]
        }]
      })
    });
 
    if(!response.ok){
      if(response.status === 401){
        statusEl.innerHTML = '⚠ کلید API نامعتبره، توی تنظیمات چکش کن.';
      } else if(response.status === 429){
        statusEl.textContent = 'محدودیت استفاده، چند لحظه صبر کن و دوباره امتحان کن.';
      } else {
        statusEl.textContent = 'خطا در سرور (' + response.status + ')، دستی وارد کن.';
      }
      aiBtn.disabled = false;
      return;
    }
 
    const data = await response.json();
    const textBlock = (data.content || []).find(c => c.type === 'text');
    let raw = textBlock ? textBlock.text : '';
    raw = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    applyExtractedFields(parsed);
 
    let usageNote = '';
    if(data.usage){
      const stats = addUsage(data.usage.input_tokens, data.usage.output_tokens);
      usageNote = ' (مصرف تا الان: $' + stats.costUSD.toFixed(3) + ')';
    }
    statusEl.textContent = 'خونده شد، لطفا بررسی و تایید کن.' + usageNote;
  }catch(e){
    statusEl.textContent = 'خطا در اتصال (اینترنت رو چک کن)، دستی وارد کن.';
  }
  aiBtn.disabled = false;
}

async function saveOrderForm(forceSave){
  const name = document.getElementById('f_name').value.trim();
  const address = document.getElementById('f_address').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const amount = Number(document.getElementById('f_amount').value.replace(/[^0-9.]/g,'')) || 0;
  const notes = document.getElementById('f_notes').value.trim();
  const orderNo = document.getElementById('f_orderno').value.trim();
  const items = document.getElementById('f_items').value.trim();
  const source = getChipValue('srcGroup');
  const existingForEdit = editingId ? currentOrders.find(x=>x.id===editingId) : null;
  const mapLink = capturedQrLink || (existingForEdit ? existingForEdit.mapLink : null) || null;
  const photoHash = capturedPhotoHash || (existingForEdit ? existingForEdit.photoHash : null) || null;
  const receiptPhoto = capturedImageBase64 || (existingForEdit ? existingForEdit.receiptPhoto : null) || null;
  const receiptPhotoMedia = capturedImageBase64 ? capturedImageMedia : (existingForEdit ? existingForEdit.receiptPhotoMedia : null) || null;
 
  if(!address && !name && !capturedImageBase64 && !mapLink){
    toast('حداقل یه چیز (نام، آدرس یا عکس رسید) لازمه');
    return;
  }
  const incomplete = !address || !name || amount <= 0;
  if(incomplete){
    toast(amount <= 0 ? 'ثبت شد (بدون مبلغ) — بعداً کاملش کن' : 'ثبت شد (ناقص) — بعداً کاملش کن');
  }
 
  if(!forceSave){
    const dup = findDuplicateOrder();
    if(dup){
      confirmDuplicateSave(dup);
      return;
    }
  }
 
  if(editingId){
    const idx = currentOrders.findIndex(x => x.id === editingId);
    if(idx > -1){
      currentOrders[idx] = { ...currentOrders[idx], name, address, phone, amount, source, notes, orderNo, items, mapLink, photoHash, incomplete, receiptPhoto, receiptPhotoMedia };
    }
  } else {
    const priorityValue = capturedReceiptTime != null ? capturedReceiptTime : nowMinutes();
    const displayTime = capturedReceiptTime != null ? minutesToDisplayTime(capturedReceiptTime) : new Date().toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' });
    currentOrders.push({
      id: 'o_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      time: displayTime,
      name, address, phone, amount, source, notes, orderNo, items, mapLink, photoHash, incomplete, receiptPhoto, receiptPhotoMedia,
      status: 'pending', priority: priorityValue, payment: null
    });
  }
  await saveOrders();
  clearDraft();
  render();
  closeModal();
  if(!incomplete) toast('سفارش ذخیره شد');
}

function syncPaymentRowsFromDom(){

    const amtEl = rowEl.querySelector('.pr-amount');
    if(amtEl) st.amountTL = amtEl.value;
    const curSel = rowEl.querySelector('.pr-currency');
    if(curSel) st.currency = curSel.value;
    const curAmt = rowEl.querySelector('.pr-currency-amount');

    if(noteEl) st.note = noteEl.value;
  });
}
 
function setPaymentRowMethod(i, method){

}
 
function addPaymentRow(){

}
 
function removePaymentRow(i){

function renderPaymentRowsUI(){

  if(!container) return;

  const defaultTL = o ? (o.amount || '') : '';
 
  container.innerHTML = paymentRowsState.map((row, i) => {

    const methodLabels = { 'نقد':'نقد', 'کارت':'کارت (پوز)', 'واریز':'واریز', 'ارز':'ارز خارجی', 'آنلاین':'پرداخت آنلاین (قبلاً پرداخت شده)', 'تیپ':'تیپ' };

      if(row.method === 'واریز'){

      fields += `<div class="order-note" style="margin-top:8px;color:var(--amber);">این جدا از مبلغ سفارشه — توی محاسبه‌ی اختلاف حساب نمی‌شه.</div>

  return `

          <button onclick="document.getElementById('posCameraInput_${i}').click()">دوربین</button>

          <button onclick="pastePosPhotoFromClipboard(${i})">چسباندن عکس</button>

        <input type="file" id="posGalleryInput_${i}" accept="image/*" onchange="onPosPhotoSelected(event, ${i})">
      </div>
  `;

async function loadPosPhotoForRow(rowIndex, blob){
  const reader = new FileReader();
  reader.onload = async () => {
    const originalDataUrl = reader.result;
    const wrap = document.getElementById('posPreviewWrap_' + rowIndex);
    if(wrap) wrap.innerHTML = `<img src="${originalDataUrl}" onclick="openImageLightbox(this.src)" style="cursor:zoom-in;">`;
    const resized = await resizeImageDataUrl(originalDataUrl, 1600);
    if(!paymentRowsState[rowIndex]) return;
    paymentRowsState[rowIndex].posMedia = resized.dataUrl.startsWith('data:image/jpeg') ? 'image/jpeg' : (blob.type || 'image/jpeg');
    paymentRowsState[rowIndex].posPhoto = resized.dataUrl.split(',')[1];
  };
  reader.readAsDataURL(blob);
}
 
function onPosPhotoSelected(evt, rowIndex){
  const file = evt.target.files[0];
  if(!file) return;
  syncPaymentRowsFromDom();
  loadPosPhotoForRow(rowIndex, file);
}
 
async function pastePosPhotoFromClipboard(rowIndex){
  if(!navigator.clipboard || !navigator.clipboard.read){
    toast('این مرورگر از چسباندن عکس پشتیبانی نمی‌کنه');
    return;
  }
  try{
    const items = await navigator.clipboard.read();
    let found = null;
    for(const item of items){
      const imgType = item.types.find(t => t.startsWith('image/'));
      if(imgType){
        found = await item.getType(imgType);
        break;
      }
    }
    if(!found){
      toast('عکسی توی کلیپ‌بورد پیدا نشد');
      return;
    }
    syncPaymentRowsFromDom();
    loadPosPhotoForRow(rowIndex, found);
    toast('عکس چسبانده شد');
  }catch(e){
    toast('اجازه دسترسی به کلیپ‌بورد داده نشد');
  }
}
 
async function confirmDelivery(){
  syncPaymentRowsFromDom();
  const o = currentOrders.find(x => x.id === payingOrderId);
  if(!o) return;
 
  const finalPayments = [];
  let tlSum = 0;
  for(const row of paymentRowsState){
    if(!row.method){
      toast('برای همه‌ی ردیف‌ها روش دریافت وجه رو انتخاب کن');
      return;
    }
    if(row.method === 'نقد' || row.method === 'کارت' || row.method === 'واریز'){
      const amt = Number(String(row.amountTL || '').replace(/[^0-9.]/g,'')) || 0;
      if(amt <= 0){ toast('مبلغ یکی از ردیف‌های پرداخت وارد نشده'); return; }
      const entry = { method: row.method, amountTL: amt };
      if(row.method === 'واریز') entry.note = (row.note || '').trim();
      if(row.method === 'کارت' || row.method === 'واریز'){
        entry.posPhoto = row.posPhoto || null;
        entry.posMedia = row.posMedia || null;
      }
      finalPayments.push(entry);
      tlSum += amt;
    } else if(row.method === 'ارز'){
      const camt = Number(String(row.currencyAmount || '').replace(/[^0-9.]/g,'')) || 0;
      if(camt <= 0){ toast('مبلغ ارز یکی از ردیف‌ها وارد نشده'); return; }
      finalPayments.push({
        method: 'ارز', currency: row.currency || CURRENCIES[0].code, currencyAmount: camt,
        note: (row.note || '').trim(), posPhoto: row.posPhoto || null, posMedia: row.posMedia || null
      });
    } else if(row.method === 'آنلاین'){
      finalPayments.push({
        method: 'آنلاین',
        note: (row.note || '').trim(), posPhoto: row.posPhoto || null, posMedia: row.posMedia || null
      });
    } else if(row.method === 'تیپ'){
      const amt = Number(String(row.amountTL || '').replace(/[^0-9.]/g,'')) || 0;
      if(amt <= 0){ toast('مبلغ تیپ وارد نشده'); return; }
      finalPayments.push({ method: 'تیپ', amountTL: amt });
    }
  }
 
  const hasTLCollectionRow = finalPayments.some(p => p.method === 'نقد' || p.method === 'کارت' || p.method === 'واریز');
  let mismatch = null;
  if(hasTLCollectionRow && (o.amount || 0) > 0 && Math.abs(tlSum - o.amount) >= 1){
    mismatch = Math.round(tlSum - o.amount);
  }
 
  const idx = currentOrders.findIndex(x => x.id === payingOrderId);
  const startedAt = currentOrders[idx].startedMovingAt;
  currentOrders[idx] = {
    ...currentOrders[idx],
    status: 'delivered',
    payments: finalPayments,
    payment: null,
    paymentMismatch: mismatch,
    deliveredAt: new Date().toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' }),
    deliveryDurationMin: startedAt ? Math.max(0, Math.round((Date.now() - startedAt) / 60000)) : null
  };
  await saveOrders();
  closeModal();
  render();
 
  const nextPending = currentOrders.filter(x => x.status !== 'delivered').sort((a,b) => (a.priority||0)-(b.priority||0));
  let mismatchNote = '';
  if(mismatch){
    const sign = mismatch > 0 ? 'بیشتر' : 'کمتر';
    mismatchNote = '⚠ ' + Math.abs(mismatch) + ' TL ' + sign + ' از فیش دریافت شد. ';
  }
  if(nextPending.length > 0){
    toast(mismatchNote + 'ثبت شد. سفارش بعدی: ' + (nextPending[0].name || nextPending[0].address || ''));
  } else {
    toast(mismatchNote + 'همه سفارش‌های صف تحویل داده شدن 🎉');
  }
}
 
function openReport(){
  renderReportSheet(currentOrders, todayKey(), true);
}
 
function renderReportSheet(orders, dayKey, isToday, isSingleDay){
  if(isSingleDay === undefined) isSingleDay = true;
  const delivered = orders.filter(o => o.status === 'delivered');
  let cashTotal = 0, cardTotal = 0, transferTotal = 0, tipTotal = 0;
  const forexTotals = {};
  delivered.forEach(o => {
    getOrderPayments(o).forEach(p => {
      if(p.method === 'نقد') cashTotal += Number(p.amountTL) || 0;
      else if(p.method === 'کارت') cardTotal += Number(p.amountTL) || 0;
      else if(p.method === 'واریز') transferTotal += Number(p.amountTL) || 0;
      else if(p.method === 'تیپ') tipTotal += Number(p.amountTL) || 0;
      else if(p.method === 'ارز') forexTotals[p.currency] = (forexTotals[p.currency]||0) + (Number(p.currencyAmount)||0);
    });
  });
  const durations = delivered.filter(o => o.deliveryDurationMin != null).map(o => o.deliveryDurationMin);
  const avgDuration = durations.length ? Math.round(durations.reduce((s,d) => s+d, 0) / durations.length) : null;
  const grandTotal = cashTotal + cardTotal + transferTotal;
  const dayLabel = dayKey.replace(STORAGE_KEY_PREFIX,'');
  const reportText = buildReportText(orders, dayLabel, cashTotal, cardTotal, transferTotal, forexTotals, grandTotal, tipTotal, avgDuration);
 
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="overlay">
    <div class="sheet">
      <div class="sheet-head">
        <h2>گزارش ${isToday ? 'امروز' : dayLabel}</h2>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="report-line"><span>کل سفارش‌ها</span><b>${orders.length}</b></div>
      ${avgDuration != null ? `<div class="report-line"><span>میانگین زمان تحویل</span><b>${avgDuration} دقیقه</b></div>` : ''}
      <div class="report-line"><span>تحویل‌شده</span><b>${delivered.length}</b></div>
      <div class="report-line"><span>نقد</span><b>${fmt(cashTotal)} TL</b></div>
      <div class="report-line"><span>کارت</span><b>${fmt(cardTotal)} TL</b></div>
      <div class="report-line"><span>واریز</span><b>${fmt(transferTotal)} TL</b></div>
      ${tipTotal > 0 ? `<div class="report-line"><span>💰 تیپ (جدا از مبلغ سفارش‌ها)</span><b>${fmt(tipTotal)} TL</b></div>` : ''}
      ${Object.keys(forexTotals).map(k => `<div class="report-line"><span>ارز (${k})</span><b>${fmt(forexTotals[k])}${currencySymbol(k)}</b></div>`).join('')}
      <div class="report-total"><span>مجموع لیر</span><span>${fmt(grandTotal)} TL</span></div>
 
      <div class="report-txt">${escapeHtml(reportText)}</div>
 
      <div class="save-bar">
        <button class="cancel" onclick="copyReport()">کپی گزارش</button>
        <button class="save" onclick="exportExcel()">دانلود اکسل</button>
      </div>
      <div class="save-bar">
        <button class="cancel" onclick="shareToDrive()">اشتراک‌گذاری در گوگل درایو</button>
      </div>
      ${isToday ? `<div class="save-bar"><button class="save" style="background:var(--red);color:#fff" onclick="confirmResetDay()">شروع روز جدید</button></div>` : (isSingleDay ? `<div class="save-bar"><button class="save" style="background:var(--red);color:#fff" onclick="confirmDeleteHistoryDay('${dayKey}')">🗑 حذف این روز از تاریخچه</button></div>` : '')}
    </div>
  </div>`;
  window._reportOrders = orders;
  window._reportDayLabel = dayLabel;
  window._reportText = reportText;
}
 
function buildReportText(orders, dayLabel, cashTotal, cardTotal, transferTotal, forexTotals, grandTotal, tipTotal, avgDuration){
  let lines = [];
  lines.push('گزارش پیک - ' + dayLabel);
  lines.push('تعداد سفارش: ' + orders.length + ' (تحویل‌شده: ' + orders.filter(o=>o.status==='delivered').length + ')');
  if(avgDuration != null) lines.push('میانگین زمان تحویل: ' + avgDuration + ' دقیقه');
  lines.push('---');
  orders.forEach((o, idx) => {
    const payments = getOrderPayments(o);
    const payTxt = payments.length
      ? payments.map(p => {
          const amtTxt = p.method === 'ارز' ? (fmt(p.currencyAmount) + currencySymbol(p.currency))
            : p.method === 'آنلاین' ? 'قبلاً پرداخت شده'
            : (fmt(p.amountTL) + ' TL');
          return amtTxt + ' [' + p.method + ']';
        }).join(' + ')
      : 'در انتظار';
    const mismatch = getOrderMismatch(o);
    const mismatchTxt = mismatch ? ' (اختلاف ' + (mismatch > 0 ? '+' : '') + fmt(mismatch) + ' TL)' : '';
    const durTxt = o.deliveryDurationMin != null ? ' | ' + o.deliveryDurationMin + ' دقیقه' : '';
    lines.push((idx+1) + '. ' + (o.name || 'بدون نام') + ' | فیش: ' + fmt(o.amount) + ' TL | دریافتی: ' + payTxt + mismatchTxt + durTxt);
  });
  lines.push('---');
  lines.push('نقد: ' + fmt(cashTotal) + ' TL');
  lines.push('کارت: ' + fmt(cardTotal) + ' TL');
  lines.push('واریز: ' + fmt(transferTotal) + ' TL');
  if(tipTotal > 0) lines.push('تیپ (جدا از مبلغ سفارش‌ها): ' + fmt(tipTotal) + ' TL');
  Object.keys(forexTotals).forEach(k => lines.push('ارز ' + k + ': ' + fmt(forexTotals[k]) + currencySymbol(k)));
  lines.push('مجموع لیر: ' + fmt(grandTotal) + ' TL');
  return lines.join('\n');
}
 
function buildExcelRows(orders){
  return orders.map((o, idx) => {
    const payments = getOrderPayments(o);
    const tlSum = payments.filter(p => p.method !== 'ارز' && p.method !== 'تیپ').reduce((s,p) => s + (Number(p.amountTL)||0), 0);
    const tipSum = payments.filter(p => p.method === 'تیپ').reduce((s,p) => s + (Number(p.amountTL)||0), 0);
    const forexParts = payments.filter(p => p.method === 'ارز').map(p => fmt(p.currencyAmount) + (p.currency||''));
    const notesParts = payments.filter(p => p.note).map(p => p.note);
    return {
      'ردیف': idx+1,
      'ساعت سفارش': o.time || '',
      'ساعت تحویل': o.deliveredAt || '',
      'مدت تحویل (دقیقه)': o.deliveryDurationMin != null ? o.deliveryDurationMin : '',
      'وضعیت': o.status === 'delivered' ? 'تحویل‌شده' : (o.incomplete ? 'ناقص' : 'در صف'),
      'نام مشتری': o.name || '',
      'آدرس': o.address || '',
      'تلفن': o.phone || '',
      'مبلغ فیش (TL)': Number(o.amount) || 0,
      'روش دریافت': payments.map(p => p.method).join(' + '),
      'مبلغ دریافتی (TL)': tlSum || '',
      'تیپ (TL)': tipSum || '',
      'اختلاف با فیش (TL)': getOrderMismatch(o) || '',
      'مبلغ دریافتی (ارز)': forexParts.join(' + '),
      'یادداشت پرداخت': notesParts.join(' | '),
      'منبع سفارش': o.source || '',
      'شماره سفارش': o.orderNo || '',
      'اقلام سفارش': o.items || '',
      'لینک نقشه': o.mapLink || '',
      'یادداشت سفارش': o.notes || ''
    };
  });
}
 
function exportExcel(){
  const orders = window._reportOrders || [];
  const dayLabel = window._reportDayLabel || 'گزارش';
  if(typeof XLSX === 'undefined'){
    toast('کتابخانه اکسل بارگذاری نشد، اینترنتت رو چک کن');
    return;
  }
  const rows = buildExcelRows(orders);
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:5},{wch:9},{wch:9},{wch:11},{wch:11},{wch:16},{wch:30},{wch:14},{wch:12},{wch:14},{wch:12},{wch:9},{wch:12},{wch:16},{wch:20},{wch:13},{wch:12},{wch:34},{wch:28},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'گزارش');
  XLSX.writeFile(wb, 'peyk-report-' + dayLabel + '.xlsx');
  toast('فایل اکسل دانلود شد');
}
 
async function shareToDrive(){
  const orders = window._reportOrders || [];
  const dayLabel = window._reportDayLabel || 'گزارش';
  if(typeof XLSX === 'undefined'){
    toast('کتابخانه اکسل بارگذاری نشد، اینترنتت رو چک کن');
    return;
  }
  const rows = buildExcelRows(orders);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'گزارش');
  const arrayBuf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const fileName = 'peyk-report-' + dayLabel + '.xlsx';
  const file = new File([arrayBuf], fileName, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
 
  if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({ files: [file], title: fileName });
    }catch(e){
      if(e.name !== 'AbortError') toast('اشتراک‌گذاری انجام نشد');
    }
  } else {
    toast('اشتراک‌گذاری مستقیم پشتیبانی نمیشه، فایل دانلود شد؛ از گوگل درایو آپلودش کن');
    exportExcel();
  }
}

    await navigator.clipboard.writeText(window._reportText || '');
    toast('گزارش کپی شد');
  }catch(e){
    toast('کپی نشد، دستی انتخاب کن');

  await saveOrders();
  render();
  closeModal();
  toast('روز جدید شروع شد');
}
 
async function openHistory(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="overlay">
    <div class="sheet">
      <div class="sheet-head">
        <h2>تاریخچه روزها</h2>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="two-col" style="margin-bottom:6px;">
        <div>
          <label>از تاریخ</label>
          <input type="date" id="histFrom">
        </div>
        <div>
          <label>تا تاریخ</label>
          <input type="date" id="histTo">
        </div>
      </div>
      <div class="save-bar" style="margin-top:8px;">
        <button class="cancel" onclick="applyHistoryFilter()">فیلتر بازه</button>
        <button class="save" onclick="clearHistoryFilter()">پاک کردن فیلتر</button>
      </div>
      <div id="histRangeReportBtn"></div>
      <div id="historyList" style="font-size:13px;color:var(--muted);margin-top:14px;">در حال بارگذاری...</div>
    </div>
  </div>`;
 
  try{
    const listRes = await localStore.list(STORAGE_KEY_PREFIX);
    const keys = (listRes && listRes.keys) ? keys_sort(listRes.keys) : [];
    if(keys.length === 0){
      document.getElementById('historyList').innerHTML = '<div class="empty">هنوز روزی ثبت نشده.</div>';
      return;
    }
    const items = await Promise.all(keys.map(async k => {
      try{
        const r = await localStore.get(k);
        const orders = r ? JSON.parse(r.value) : [];
        let total = 0;
        orders.filter(o=>o.status==='delivered').forEach(o => {
          getOrderPayments(o).forEach(p => {
            if(p.method !== 'ارز') total += Number(p.amountTL) || 0;
          });
        });
        return { key: k, count: orders.length, total, orders };
      }catch(e){
        return { key: k, count: 0, total: 0, orders: [] };
      }
    }));
    window._historyCache = items;
    renderHistoryList(items);
  }catch(e){
    document.getElementById('historyList').innerHTML = '<div class="empty">خطا در بارگذاری تاریخچه.</div>';
  }
}
 
function keys_sort(keys){
  return keys.slice().sort().reverse();
}
 
function renderHistoryList(items){
  const listEl = document.getElementById('historyList');
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty">روزی در این بازه پیدا نشد.</div>';
    document.getElementById('histRangeReportBtn').innerHTML = '';
    return;
  }
  listEl.innerHTML = items.map(it => `
    <div class="order">
      <div class="order-body" style="padding:12px 14px;">
        <div class="order-top" style="cursor:pointer;" onclick='openHistoryDay("${it.key}")'>
          <div class="order-name" style="font-size:14px;">${it.key.replace(STORAGE_KEY_PREFIX,'')}</div>
          <div class="order-amt" style="font-size:16px;">${fmt(it.total)} TL</div>
        </div>
        <div class="order-addr" style="cursor:pointer;" onclick='openHistoryDay("${it.key}")'>${it.count} سفارش</div>
        <div class="order-actions">
          <button class="danger" onclick='confirmDeleteHistoryDay("${it.key}")'>🗑 حذف این روز از تاریخچه</button>
        </div>
      </div>
    </div>
  `).join('');
 
  const rangeBtnHolder = document.getElementById('histRangeReportBtn');
  if(items.length > 1){
    rangeBtnHolder.innerHTML = `<button class="fab secondary" style="width:100%;margin-top:4px;" onclick="openRangeReport()">گزارش کل این بازه (${items.length} روز)</button>`;
  } else {
    rangeBtnHolder.innerHTML = '';
  }
}
 
function applyHistoryFilter(){
  const from = document.getElementById('histFrom').value;
  const to = document.getElementById('histTo').value;
  const all = window._historyCache || [];
  const filtered = all.filter(it => {
    const d = it.key.replace(STORAGE_KEY_PREFIX,'');
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  });
  renderHistoryList(filtered);
}
 
function clearHistoryFilter(){
  document.getElementById('histFrom').value = '';
  document.getElementById('histTo').value = '';
  renderHistoryList(window._historyCache || []);
}
 
function openRangeReport(){
  const from = document.getElementById('histFrom').value;
  const to = document.getElementById('histTo').value;
  const all = window._historyCache || [];
  const filtered = all.filter(it => {
    const d = it.key.replace(STORAGE_KEY_PREFIX,'');
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  });
  let combined = [];
  filtered.forEach(it => { combined = combined.concat(it.orders); });
  const label = (from || 'ابتدا') + ' تا ' + (to || 'انتها');
  renderReportSheet(combined, STORAGE_KEY_PREFIX + label, false, false);
}
 
function confirmDeleteHistoryDay(key){
  const root = document.getElementById('modalRoot');
  const label = key.replace(STORAGE_KEY_PREFIX,'');
  root.insertAdjacentHTML('beforeend', `
  <div class="overlay" style="z-index:70;">
    <div class="sheet" style="max-width:400px;border-radius:16px;">
      <p style="font-size:14px;line-height:1.7;">مطمئنی می‌خوای گزارش روز ${escapeHtml(label)} رو کامل حذف کنی؟ این کار برگشت‌پذیر نیست.</p>
      <div class="save-bar">
        <button class="cancel" onclick="closeDuplicateConfirm()">انصراف</button>
        <button class="save" style="background:var(--red);color:#fff" onclick="deleteHistoryDay('${key}')">حذف کن</button>
      </div>
    </div>
  </div>`);
}
 
async function deleteHistoryDay(key){
  localStorage.removeItem(key);
  window._historyCache = (window._historyCache || []).filter(it => it.key !== key);
  closeModal();
  if(key === todayKey()){
    currentOrders = [];
    render();
  }
  toast('حذف شد');
}
 
function openHistoryDay(key){
  const item = (window._historyCache || []).find(x => x.key === key);
  if(!item) return;
  const isToday = key === todayKey();
  renderReportSheet(item.orders, key, isToday);
}

let backExitArmed = false;
let backExitTimer = null;
 
function pushBackGuard(){
  try{ history.pushState({ peykGuard: true }, '', location.href); }catch(e){}
}
 
function hasOpenOverlay(){
  return !!(document.getElementById('qrScanOverlay') || document.getElementById('lightboxOverlay') ||
    (document.getElementById('modalRoot') && document.getElementById('modalRoot').innerHTML.trim() !== ''));
}
 
function closeTopmostOverlay(){
  if(document.getElementById('qrScanOverlay')){ stopQrScanner(); return; }
  if(document.getElementById('lightboxOverlay')){ closeLightbox(); return; }
  const overlays = document.querySelectorAll('#modalRoot .overlay, #modalRoot .qr-scan-overlay');
  if(overlays.length > 1){
    overlays[overlays.length - 1].remove();
  } else if(overlays.length === 1){
    closeModal();
  }
}
 
window.addEventListener('popstate', () => {
  if(hasOpenOverlay()){
    closeTopmostOverlay();
    pushBackGuard();
    return;
  }
  if(backExitArmed){
    return; // second back press within the window — let it actually exit
  }
  backExitArmed = true;
  toast('برای خروج از برنامه، دوباره دکمه برگشت رو بزن');
  if(backExitTimer) clearTimeout(backExitTimer);
  backExitTimer = setTimeout(() => { backExitArmed = false; }, 2000);
});
 
pushBackGuard();

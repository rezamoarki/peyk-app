2%3A%20%7B%22title%22%3A%20%22shared_title%22%2C%20%22text%22%3A%20%22shared_text%22%2C%20%22url%22%3A%20%22shared_url%22%7D%7D%7D">

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg:#14171C;
  --card:#1E232B;
  --card2:#262D37;
  --line:#333A45;
  --paper:#F4EFE2;
  --ink:#1C1B17;
  --amber:#E3A857;
  --amber-ink:#412402;
  --teal:#3C9E86;
  --teal-ink:#04342C;
  --blue-ink:#0c447c;
  --blue-bg:#E6F1FB;
  --purple-ink:#3c3489;
  --purple-bg:#EEEDFE;
  --cash:#EF9F27;
  --card-pay:#5DCAA5;
  --red:#E0645F;
  --muted:#A6ABB5;
  --text:#FFFFFF;
  --tip-ink:#146c2e;
  --tip-bg:#DFF5E3;
  --deficit-ink:#791F1F;
  --deficit-bg:#FCEBEB;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',sans-serif;}
body{padding-bottom:90px;min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700;}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 0;}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-bottom:10px;}
.title-row{display:flex;align-items:center;justify-content:space-between;padding-top:12px;}
.title-row h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px;}
.title-row .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.date-chip{font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 4px;color:var(--text);text-align:center;}
.mini-btn{background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:12px;padding:6px 10px;border-radius:8px;font-family:inherit;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.received-panel{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.received-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.received-panel-head .sub-inline{font-size:12px;color:var(--muted);}
.received-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);}
.received-line:last-child{border-bottom:none;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 4px;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:5px;}
.stat b{font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:700;}
.stat span{font-size:11px;color:var(--muted);}
.stat.cash b{color:var(--cash);}
.stat.card b{color:var(--card-pay);}
.forex-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;}

.section-label{font-size:12px;color:var(--muted);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;}

.order{position:relative;background:var(--paper);color:var(--ink);border-radius:10px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.order.active{box-shadow:0 0 0 2px var(--amber),0 2px 6px rgba(0,0,0,.35);}
.order-body{padding:12px 14px 10px;}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.order-num{font-size:12px;color:#8a8574;font-family:'JetBrains Mono',monospace;font-weight:700;margin-top:6px;}
.order-name{font-size:19px;font-weight:700;margin:0 0 2px;}
.order-addr{font-size:12px;color:#4a463a;line-height:1.5;margin-bottom:6px;}
.order-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.badge{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600;font-family:'Vazirmatn',sans-serif;}
.badge.cash{background:#FAEEDA;color:var(--amber-ink);}
.badge.card{background:#E1F5EE;color:var(--teal-ink);}
.badge.transfer{background:#E6F1FB;color:var(--blue-ink);}
.badge.forex{background:#EEEDFE;color:var(--purple-ink);}
.badge.online{background:var(--tip-bg);color:var(--tip-ink);}
.badge.src{background:#eee;color:#555;}
.badge.pending{background:var(--deficit-bg);color:var(--deficit-ink);}
.order-amt{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--cash);white-space:nowrap;}
.order-actions{display:grid;grid-template-columns:repeat(auto-fill, minmax(78px, 1fr));gap:6px;margin-top:10px;border-top:1px dashed #cfc7ae;padding-top:8px;}
.order-actions button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#eae4d2;border:1px solid #d8d0ba;font-size:11px;color:#5a5647;padding:8px 4px;border-radius:8px;font-family:inherit;text-align:center;line-height:1.3;}
.order-actions button .ico{font-size:17px;line-height:1;}
.order-actions button:active{background:#e8e2d0;}
.order-actions button.danger{color:#9c3b34;border-color:#e5c6c2;}
.order-actions button.primary-act{background:var(--amber);color:var(--amber-ink);font-weight:700;grid-column:1 / -1;padding:12px 4px;border:none;}
.order-note{font-size:11.5px;color:#736c58;margin-top:6px;}
.order-note-dark{font-size:11.5px;color:var(--muted);margin-top:6px;}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;border:1px dashed var(--line);border-radius:12px;}

.fab-row{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,var(--bg) 60%,transparent);padding:14px 14px 18px;z-index:30;}
.fab-inner{max-width:520px;margin:0 auto;display:flex;gap:10px;}
.fab{flex:1;border:none;border-radius:14px;padding:13px 6px;font-size:12px;font-weight:700;font-family:inherit;white-space:nowrap;}
.fab.primary{background:var(--amber);color:var(--amber-ink);}
.fab.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);}

.overlay{position:fixed;inset:0;background:rgba(10,12,15,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px;border-top:1px solid var(--line);}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sheet-head h2{font-size:16px;margin:0;}
.close-x{background:var(--card2);border:none;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:16px;}

label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;}
input[type=text],input[type=tel],input[type=date],input[type=number],textarea,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;}
.amount-input{border:2px solid var(--amber);font-weight:700;}
textarea{min-height:64px;resize:vertical;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chip-group{display:flex;gap:8px;flex-wrap:wrap;}
.chip{flex:1;min-width:80px;text-align:center;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;font-family:inherit;color:var(--text);}
.chip.active{border-color:var(--amber);background:rgba(227,168,87,.15);color:var(--amber);font-weight:700;}

.photo-zone{border:1.5px dashed var(--line);border-radius:9px;padding:5px;text-align:center;margin-top:6px;}
.photo-zone img{max-width:100%;max-height:140px;border-radius:8px;margin-bottom:8px;}
.photo-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.photo-btns button{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:8px;font-size:11.5px;font-family:inherit;}
.photo-btns button.ai{background:var(--amber);color:var(--amber-ink);border:none;font-weight:700;}
.photo-btns button:disabled{opacity:.5;}
.hidden-file-input{display:none;}
.ai-status{font-size:12px;color:var(--amber);margin-top:8px;min-height:16px;}
.dup-warning{background:rgba(224,100,95,.15);border:1px solid var(--red);color:#f3a8a5;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:14px;line-height:1.6;}

.loc-group{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card);}
.loc-group > summary{padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;list-style:none;color:var(--amber);}
.loc-group > summary::-webkit-details-marker{display:none;}
.loc-group[open] > summary{border-bottom:1px solid var(--line);}
.loc-group .loc-subgroup{margin:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);}
.loc-subgroup > summary{padding:9px 12px;font-size:12px;font-weight:600;cursor:pointer;list-style:none;color:var(--text);}
.loc-subgroup > summary::-webkit-details-marker{display:none;}
.loc-subgroup .order{margin:6px 10px 10px;}

.save-bar{margin-top:18px;display:flex;gap:10px;}
.save-bar button{flex:1;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;font-family:inherit;}
.save-bar .save{background:var(--amber);color:var(--amber-ink);}
.save-bar .cancel{background:var(--card2);color:var(--text);border:1px solid var(--line);}

.report-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.report-line b{font-family:'JetBrains Mono',monospace;}
.report-total{margin-top:8px;padding-top:12px;border-top:2px solid var(--amber);display:flex;justify-content:space-between;font-size:16px;font-weight:700;}
.report-txt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;line-height:1.7;margin-top:14px;color:var(--muted);max-height:220px;overflow-y:auto;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:9px 18px;border-radius:20px;font-size:13px;z-index:200;}

.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;flex-direction:column;}
.lightbox-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:flex-start;touch-action:pan-x pan-y;}
.lightbox-scroll img{display:block;transition:width .15s ease;max-width:none;}
.lightbox-bar{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px;background:rgba(20,23,28,.95);}
.lightbox-bar button{background:var(--card2);border:1px solid var(--line);color:var(--text);width:44px;height:44px;border-radius:10px;font-size:18px;}
.lightbox-bar .lb-close{background:var(--red);color:#fff;border:none;font-weight:700;width:auto;padding:0 18px;}

.qr-scan-overlay{position:fixed;inset:0;background:#000;z-index:85;display:flex;flex-direction:column;}
.qr-scan-video-wrap{flex:1;position:relative;overflow:hidden;}
.qr-scan-video-wrap video{width:100%;height:100%;object-fit:cover;}
.qr-scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;max-width:320px;aspect-ratio:1/1;border:3px solid var(--amber);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);}
.qr-scan-status{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px;}
.qr-scan-bar{padding:14px;display:flex;justify-content:center;background:#000;}
.qr-scan-bar button{background:var(--red);color:#fff;border:none;padding:12px 30px;border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-row" style="justify-content:space-between;gap:10px;align-items:center;">
      <h1>پیک سوشین <span id="versionLabel" style="font-size:11px;color:var(--amber);font-weight:600;"></span></h1>
      <div class="sub" id="dateLabel" style="white-space:nowrap;"></div>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button id="expensesBtn" class="date-chip" style="cursor:pointer;flex:1;">🧾 هزینه‌ها</button>
      <button id="locationsBtn" class="date-chip" style="cursor:pointer;flex:1;">📍 لوکیشن‌ها</button>
      <button id="settingsBtn" class="date-chip" style="cursor:pointer;flex:1;">⚙ تنظیمات</button>
    </div>
    <div class="stats">
      <div class="stat" onclick="showQueueList()" style="cursor:pointer;"><b id="statQueue">0</b><span>در صف</span></div>
      <div class="stat" onclick="showDeliveredList()" style="cursor:pointer;"><b id="statDelivered">0</b><span>تحویل‌شده</span></div>
      <div class="stat" onclick="showCancelledList()" style="cursor:pointer;"><b id="statCancelled">0</b><span>کنسل‌شده</span></div>
    </div>
    <div class="received-panel">
      <div class="received-panel-head">
        <div>
          <span><b id="statTotal">0</b> <span class="sub-inline">کل مبلغ دریافتی</span></span>
          <div id="statForexLine" style="font-size:11px;color:var(--muted);margin-top:2px;display:none;"></div>
        </div>
        <button id="receivedToggleBtn" class="mini-btn" onclick="toggleReceivedPanel()">مخفی کن</button>
      </div>
      <div id="receivedPanelBody"></div>
    </div>
    <div class="forex-note" id="forexNote" style="display:none;"></div>
  </header>

  <div id="mainContent"></div>
</div>

<div class="fab-row">
  <div class="fab-inner">
    <button class="fab secondary" id="historyBtn" style="flex:0.7;padding:11px 4px;">تاریخچه</button>
    <div style="flex:1.3;display:flex;border-radius:14px;overflow:hidden;">
      <button id="addBtnCamera" style="flex:1;background:var(--amber);color:var(--amber-ink);border:none;font-family:inherit;font-weight:700;font-size:11px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;">
        <span style="font-size:16px;">📷</span>دوربین
      </button>
      <button id="addBtnGallery" style="flex:1;background:var(--amber);color:var(--amber-ink);border:none;border-right:1px solid rgba(0,0,0,.18);font-family:inherit;font-weight:700;font-size:11px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;">
        <span style="font-size:16px;">🖼</span>گالری
      </button>
      <button id="addBtnManual" style="flex:1;background:var(--amber);color:var(--amber-ink);border:none;border-right:1px solid rgba(0,0,0,.18);font-family:inherit;font-weight:700;font-size:11px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;">
        <span style="font-size:16px;">✏️</span>دستی
      </button>
    </div>
  </div>
</div>

<input type="file" id="newOrderCameraInput" class="hidden-file-input" accept="image/*" capture="environment" onchange="onNewOrderPhotoTaken(event)">
<input type="file" id="newOrderGalleryInput" class="hidden-file-input" accept="image/*" onchange="onNewOrderPhotoTaken(event)">

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const APP_VERSION = 'v13.0 · 2026-08-31';
const STORAGE_KEY_PREFIX = 'orders:';
const EXPENSE_KEY_PREFIX = 'expenses:';
const EXPENSE_CATEGORIES = ['بنزین', 'خرید فروشگاهی', 'سایر'];
const EXPENSE_SOURCES = ['خودم', 'صندوق', 'مشتری‌ها'];
const CURRENCIES = [
  { code:'GBP', label:'پوند (GBP)', symbol:'£' },
  { code:'EUR', label:'یورو (EUR)', symbol:'€' },
  { code:'USD', label:'دلار (USD)', symbol:'$' }
];
const RESTAURANT_PHONE_BLACKLIST = ['905391246624', '905391226624', '5391246624', '5391226624'];

const localStore = {
  async get(key){
    const v = localStorage.getItem(key);
    return v !== null ? { key, value: v } : null;
  },
  async set(key, value){
    try{
      localStorage.setItem(key, value);
      return { key, value };
    }catch(e){
      toast('⚠ حافظه‌ی گوشی برای ذخیره پر شده! برو تنظیمات → پاکسازی عکس‌های قدیمی', true);
      throw e;
    }
  },
  async list(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!prefix || (k && k.indexOf(prefix) === 0)) keys.push(k);
    }
    return { keys };
  }
};

const IDB_NAME = 'peyk_sushinn_db';
const IDB_STORE_NAME = 'kv';
let _idbPromise = null;

function openIdb(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    if(!('indexedDB' in window)){ reject(new Error('no-indexeddb')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE_NAME)){
        db.createObjectStore(IDB_STORE_NAME, { keyPath: 'key' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error || new Error('idb-open-failed'));
  });
  return _idbPromise;
}

const idbStore = {
  async get(key){
    try{
      const db = await openIdb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE_NAME, 'readonly');
        const req = tx.objectStore(IDB_STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result ? { key, value: req.result.value } : null);
        req.onerror = () => reject(req.error);
      });
    }catch(e){
      return localStore.get(key);
    }
  },
  async set(key, value){
    try{
      const db = await openIdb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
        const req = tx.objectStore(IDB_STORE_NAME).put({ key, value });
        req.onsuccess = () => resolve({ key, value });
        req.onerror = () => reject(req.error);
      });
    }catch(e){
      return localStore.set(key, value);
    }
  },
  async list(prefix){
    try{
      const db = await openIdb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE_NAME, 'readonly');
        const req = tx.objectStore(IDB_STORE_NAME).getAllKeys();
        req.onsuccess = () => {
          const keys = req.result.filter(k => !prefix || String(k).indexOf(prefix) === 0);
          resolve({ keys });
        };
        req.onerror = () => reject(req.error);
      });
    }catch(e){
      return localStore.list(prefix);
    }
  },
  async delete(key){
    try{
      const db = await openIdb();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
        const req = tx.objectStore(IDB_STORE_NAME).delete(key);
        req.onsuccess = () => resolve(true);
        req.onerror = () => reject(req.error);
      });
    }catch(e){
      try{ localStorage.removeItem(key); }catch(e2){}
      return true;
    }
  }
};

async function migrateOrdersToIndexedDb(){
  const flagKey = 'idb_migration_done_v1';
  if(localStorage.getItem(flagKey)) return;
  try{
    const keysToMove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(STORAGE_KEY_PREFIX) === 0) keysToMove.push(k);
    }
    for(const k of keysToMove){
      const v = localStorage.getItem(k);
      if(v != null){
        await idbStore.set(k, v);
        localStorage.removeItem(k);
      }
    }
    localStorage.setItem(flagKey, '1');
  }catch(e){
    console.error('IndexedDB migration failed, staying on localStorage:', e);
  }
}

function renderTreasurySummary(expenses){
  const wrap = document.getElementById('treasurySummaryWrap');
  if(!wrap) return;

  const customerCashCollected = currentOrders
    .filter(o => o.status === 'delivered')
    .reduce((s,o) => s + getOrderPayments(o).filter(p => p.method === 'نقد').reduce((s2,p) => s2 + (Number(p.amountTL)||0), 0), 0);

  const expensesFromCustomerCash = expenses.filter(e => (e.type||'expense') === 'expense' && e.source === 'مشتری‌ها').reduce((s,e) => s + (Number(e.amount)||0), 0);
  const cashHandedToBox = expenses.filter(e => e.type === 'cashbox_payment').reduce((s,e) => s + (Number(e.amount)||0), 0);
  const netCustomerCashOwed = customerCashCollected - expensesFromCustomerCash - cashHandedToBox;

  const cashboxIncome = expenses.filter(e => e.type === 'cashbox_income').reduce((s,e) => s + (Number(e.amount)||0), 0);
  const expensesFromCashbox = expenses.filter(e => (e.type||'expense') === 'expense' && e.source === 'صندوق').reduce((s,e) => s + (Number(e.amount)||0), 0);
  const cashboxBalance = cashboxIncome - expensesFromCashbox;

  const expensesFromOwnMoney = expenses.filter(e => (e.type||'expense') === 'expense' && (e.source === 'خودم' || !e.source)).reduce((s,e) => s + (Number(e.amount)||0), 0);

  wrap.innerHTML = `
    <div class="report-line"><span>نقد مشتری‌ها که باید تحویل بدی</span><b>${fmt(netCustomerCashOwed)} TL</b></div>
    <div class="report-line"><span>باقی‌مانده‌ی پول صندوق دستت</span><b>${fmt(cashboxBalance)} TL</b></div>
    <div class="report-line"><span>هزینه‌ی شخصی خودت</span><b>${fmt(expensesFromOwnMoney)} TL</b></div>
  `;
}

function renderExpensesList(expenses){
  const wrap = document.getElementById('expensesListWrap');
  if(!wrap) return;
  if(expenses.length === 0){
    wrap.innerHTML = '<div class="empty">هنوز چیزی ثبت نشده.</div>';
    return;
  }
  wrap.innerHTML = expenses.slice().reverse().map(e => {
    const type = e.type || 'expense';
    let title, badgeClass, sign;
    if(type === 'cashbox_income'){
      title = '💰 دریافتی از صندوق' + (e.note ? ' — ' + escapeHtml(e.note) : '');
      badgeClass = 'transfer';
      sign = '+';
    } else if(type === 'cashbox_payment'){
      title = '📤 پرداخت نقدی به صندوق' + (e.note ? ' — ' + escapeHtml(e.note) : '');
      badgeClass = 'cash';
      sign = '-';
    } else {
      const sourceLabel = e.source ? ' (از پول ' + escapeHtml(e.source) + ')' : '';
      title = escapeHtml(e.category) + sourceLabel + (e.note ? ' — ' + escapeHtml(e.note) : '');
      badgeClass = 'pending';
      sign = '-';
    }
    return `
    <div class="order">
      <div class="order-body">
        <div class="order-name">${title}</div>
        <div class="order-addr">${escapeHtml(e.time || '')}</div>
        <div class="order-actions">
          <span class="badge ${badgeClass}">${sign}${fmt(e.amount)} TL</span>
          <button class="danger" onclick="deleteExpense('${e.id}')">حذف</button>
        </div>
      </div>
    </div>
  `;
  }).join('');
}

function findCaesarBlockMatch(text){
  if(!text) return null;
  const norm = text.toLowerCase();
  for(const block of CAESAR_RESORT_BLOCKS){
    const variants = [block.name.toLowerCase()].concat((CAESAR_NAME_FA_VARIANTS[block.name] || []));
    if(variants.some(v => norm.includes(v.toLowerCase()))){
      return block;
    }
  }
  return null;
}

function textSimilarity(a, b){
  const normalize = (s) => (s||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(w => w.length > 1);
  const wordsA = normalize(a);
  const wordsB = normalize(b);
  if(wordsA.length === 0 || wordsB.length === 0) return 0;
  const setA = new Set(wordsA);
  const setB = new Set(wordsB);
  let common = 0;
  setA.forEach(w => { if(setB.has(w)) common++; });
  return common / Math.max(setA.size, setB.size);
}

async function checkReturningCustomer(){
  const banner = document.getElementById('customerMatchBanner');
  if(!banner) return;
  const name = (document.getElementById('f_name') || {}).value || '';
  const phone = (document.getElementById('f_phone') || {}).value || '';
  const address = (document.getElementById('f_address') || {}).value || '';

  const matches = await findMatchingHistoryEntries(name, phone, address);
  if(!document.getElementById('customerMatchBanner')) return; // form may have closed while awaiting

  if(matches.length === 0){
    banner.innerHTML = '';
    return;
  }
  if(matches.length === 1 && textSimilarity(matches[0].address, address) >= 0.85){
    banner.innerHTML = '';
    return; // already basically matches what's typed, nothing to suggest
  }

  window._customerAddrOptions = matches;
  if(matches.length === 1){
    const h = matches[0];
    banner.innerHTML = `<div class="order-note" style="margin-top:6px;color:var(--teal);">🔁 این شبیه یه سفارش قبلیه (${escapeHtml(h.name || 'بدون نام')} — ${escapeHtml(h.date)}) — آدرس ثبت‌شده: «${escapeHtml(h.address)}»

        &nbsp;|&nbsp;
        <span style="text-decoration:underline;cursor:pointer;color:var(--muted);" onclick="dismissCustomerMatch()">نه، جدیده — دستی وارد می‌کنم</span>
      </div></div>`;
  } else {
    banner.innerHTML = `<div class="order-note" style="margin-top:6px;color:var(--teal);">🔁 چند سفارش قبلیِ شبیه این پیدا شد — مطمئن شو کدومه:</div>` +

function migrateCaesarLocationGroups(){
  const list = getSavedLocations();
  let changed = false;
  list.forEach(l => {
    if(l.id && l.id.indexOf('loc_caesar_') === 0){
      const n = parseInt(l.id.replace('loc_caesar_',''), 10);
      const block = CAESAR_RESORT_BLOCKS.find(b => b.n === n);
      if(block){
        if(!l.group){
          l.group = 'شهرک سزار ریسورت (Caesar Resort)';
          l.subGroup = 'فاز ' + block.phase;
          l.subGroupOrder = block.phase;
          l.sortKey = block.n;
          changed = true;
        }
        const compactFormat = block.name + ' -F' + block.phase + '-B' + block.n;
        if(l.name !== compactFormat){
          l.name = compactFormat;
          changed = true;
        }
        if(l.address !== compactFormat){
          l.address = compactFormat;
          changed = true;
        }
      }
    }
  });
  if(changed) setSavedLocations(list);
}

const AI_PRICE_PER_MTOK_IN = 3;

function getUsageStats(){
  try{
    const raw = localStorage.getItem('ai_usage_stats');
    return raw ? JSON.parse(raw) : { count: 0, inputTokens: 0, outputTokens: 0, costUSD: 0 };
  }catch(e){
    return { count: 0, inputTokens: 0, outputTokens: 0, costUSD: 0 };
  }

function addUsage(inputTokens, outputTokens){
  const stats = getUsageStats();
  stats.count += 1;
  stats.inputTokens += inputTokens || 0;
  stats.outputTokens += outputTokens || 0;
  stats.costUSD += ((inputTokens||0)/1e6)*AI_PRICE_PER_MTOK_IN + ((outputTokens||0)/1e6)*AI_PRICE_PER_MTOK_OUT;
  localStorage.setItem('ai_usage_stats', JSON.stringify(stats));
  return stats;
}

function renderLocationsList(){
  const wrap = document.getElementById('locationsListWrap');
  if(!wrap) return;
  const q = (document.getElementById('locSearch').value || '').trim().toLowerCase();
  const all = getSavedLocations();
  const matches = (l) => !q ||
    (l.name || '').toLowerCase().includes(q) ||
    (l.address || '').toLowerCase().includes(q) ||
    (l.group || '').toLowerCase().includes(q) ||
    (l.subGroup || '').toLowerCase().includes(q);
  const list = all.filter(matches);

  if(list.length === 0){
    wrap.innerHTML = '<div class="empty">لوکیشنی پیدا نشد.</div>';
    return;
  }

  const grouped = {};
  const ungrouped = [];
  list.forEach(l => {
    if(l.group){
      if(!grouped[l.group]) grouped[l.group] = {};
      const sg = l.subGroup || 'سایر';
      if(!grouped[l.group][sg]) grouped[l.group][sg] = [];
      grouped[l.group][sg].push(l);
    } else if(l.region){
      if(!grouped[l.region]) grouped[l.region] = {};
      if(!grouped[l.region]['سایر']) grouped[l.region]['سایر'] = [];
      grouped[l.region]['سایر'].push(l);
    } else {
      ungrouped.push(l);
    }
  });

  const hasSearch = !!q;
  let html = '';

  Object.keys(grouped).forEach(groupName => {
    const subGroups = grouped[groupName];
    let totalCount = 0;
    Object.values(subGroups).forEach(arr => totalCount += arr.length);
    const subGroupNames = Object.keys(subGroups).sort((a,b) => {
      const oa = subGroups[a][0].subGroupOrder != null ? subGroups[a][0].subGroupOrder : 0;
      const ob = subGroups[b][0].subGroupOrder != null ? subGroups[b][0].subGroupOrder : 0;
      return oa - ob;
    });
    html += `<details class="loc-group"${hasSearch ? ' open' : ''}>
      <summary>${escapeHtml(groupName)} (${totalCount})</summary>`;
    if(subGroupNames.length === 1 && subGroupNames[0] === 'سایر'){
      const items = subGroups['سایر'].slice().sort((a,b) => (a.sortKey||0) - (b.sortKey||0));
      html += items.map(locationCardHtml).join('');
    } else {
      subGroupNames.forEach(sgName => {
        const items = subGroups[sgName].slice().sort((a,b) => (a.sortKey||0) - (b.sortKey||0));
        html += `<details class="loc-subgroup"${hasSearch ? ' open' : ''}>
          <summary>${escapeHtml(sgName)} (${items.length})</summary>
          ${items.map(locationCardHtml).join('')}
        </details>`;
      });
    }
    html += `</details>`;
  });

  if(ungrouped.length > 0){
    if(Object.keys(grouped).length > 0){
      html += `<div class="section-label"><span>سایر لوکیشن‌ها (${ungrouped.length})</span></div>`;
    }
    html += ungrouped.map(locationCardHtml).join('');
  }

  wrap.innerHTML = html;
}

function loadLocationPhotoFromBlob(blob){
  const statusEl = document.getElementById('locPhotoStatus');
  if(statusEl) statusEl.textContent = 'در حال آماده‌سازی عکس...';
  const reader = new FileReader();
  reader.onload = async () => {
    const originalDataUrl = reader.result;
    const wrap = document.getElementById('locPhotoPreviewWrap');
    if(wrap) wrap.innerHTML = `<img src="${originalDataUrl}" onclick="openImageLightbox(this.src)" style="cursor:zoom-in;">`;
    const resized = await resizeImageDataUrl(originalDataUrl, 1280);
    window._locFormPhotoMedia = resized.dataUrl.startsWith('data:image/jpeg') ? 'image/jpeg' : (blob.type || 'image/jpeg');
    window._locFormPhotoBase64 = resized.dataUrl.split(',')[1];
    const aiBtn = document.getElementById('locAiReadBtn');
    if(aiBtn) aiBtn.disabled = false;

    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      let imageData = null;
      try{ imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }catch(e){}
      const result = await detectQrCode(canvas, imageData);
      if(result){
        window._locFormMapLink = result;
        const mapStatusEl = document.getElementById('locMapLinkStatus');
        if(mapStatusEl){ mapStatusEl.textContent = 'لینک نقشه از QR عکس ثبت شد ✓'; mapStatusEl.style.color = 'var(--teal)'; }
        if(statusEl) statusEl.textContent = 'عکس آماده‌ست، QR هم پیدا شد ✓';
      } else {
        if(statusEl) statusEl.textContent = 'عکس آماده‌ست (QR ای توش پیدا نشد)';
      }
    };
    img.src = resized.dataUrl;
  };
  reader.readAsDataURL(blob);
}

async function runLocationAiRead(){

  const btn = document.getElementById('locAiReadBtn');

  const claudeKey = getApiKey();
  if(!geminiKey && !nvidiaKey && !claudeKey){ toast('اول یه کلید Gemini، NVIDIA یا کلود توی تنظیمات ذخیره کن'); return; }

  btn.disabled = true;
  statusEl.textContent = 'در حال خواندن آدرس از عکس...';

  const prompt = `این عکس مربوط به یک لوکیشن، تابلوی راهنما، نقشه، یا رسید سفارش است. فقط و فقط چیزهایی که واقعاً و مستقیم توی خود عکس نوشته شده رو استخراج کن — هیچی حدس نزن یا اضافه نکن. اگه اسم مکان/شهرک/بلوک/مجتمع مشخص بود استخراجش کن. اگه این یه رسید سفارشه، اسم مشتری و شماره تلفن مشتری رو هم جدا بردار — ولی اگه شماره ثابت خود رستوران/فروشگاه (که معمولاً پایین رسید تکراری چاپ شده) بود، اون رو به‌عنوان تلفن مشتری برندار. هر توضیح آدرس یا مسیری که هست رو هم بردار. اگه متن به ترکی یا انگلیسی یا زبان دیگه بود، به فارسی ترجمه‌ش کن؛ اگه از قبل فارسی بود همون رو بنویس. فقط یک JSON خام برگردون: {"placeName": "اسم مکان/شهرک/بلوک اگر مشخص است وگرنه خالی", "customerName": "اسم مشتری روی رسید اگر هست وگرنه خالی", "phone": "شماره تلفن مشتری روی رسید اگر هست وگرنه خالی", "address": "آدرس یا توضیح مسیر ترجمه‌شده به فارسی، اگر چیزی نبود خالی"}`;

  try{
    let parsed;
    if(geminiKey){
      const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": geminiKey },
        body: JSON.stringify({
          contents: [{ parts: [
            { inline_data: { mime_type: window._locFormPhotoMedia, data: window._locFormPhotoBase64 } },
            { text: prompt }
          ]}],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: { type:"OBJECT", properties: { placeName:{type:"STRING"}, customerName:{type:"STRING"}, phone:{type:"STRING"}, address:{type:"STRING"} } }
          }
        })
      });
      if(!response.ok) throw new Error('gemini-' + response.status);
      const data = await response.json();
      const rawText = data.candidates && data.candidates[0] && data.candidates[0].content &&
        data.candidates[0].content.parts && data.candidates[0].content.parts[0] ?
        data.candidates[0].content.parts[0].text : '';
      parsed = JSON.parse(rawText);
    } else if(nvidiaKey){
      const response = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + nvidiaKey },
        body: JSON.stringify({
          model: "meta/llama-4-maverick-17b-128e-instruct", max_tokens: 500,
          messages: [{ role: "user", content: [
            { type: "text", text: prompt + '\n\nفقط JSON خام برگردون، بدون ```.' },
            { type: "image_url", image_url: { url: "data:" + window._locFormPhotoMedia + ";base64," + window._locFormPhotoBase64 } }
          ]}]
        })
      });
      if(!response.ok) throw new Error('nvidia-' + response.status);
      const data = await response.json();
      let raw = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
      raw = raw.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(raw);
    } else {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json", "x-api-key": claudeKey,
          "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6", max_tokens: 500,
          messages: [{ role: "user", content: [
            { type: "image", source: { type:"base64", media_type: window._locFormPhotoMedia, data: window._locFormPhotoBase64 } },
            { type: "text", text: prompt + '\n\nفقط JSON خام برگردون، بدون ```.' }
          ]}]
        })
      });
      if(!response.ok) throw new Error('claude-' + response.status);
      const data = await response.json();
      const textBlock = (data.content || []).find(c => c.type === 'text');
      let raw = textBlock ? textBlock.text : '';
      raw = raw.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(raw);
      if(data.usage) addUsage(data.usage.input_tokens, data.usage.output_tokens);
    }

    if(!document.getElementById('loc_name').value.trim()){
      const cleanPhone = (parsed.phone && !isRestaurantPhone(parsed.phone)) ? parsed.phone : '';
      const fallbackName = parsed.customerName || parsed.placeName || cleanPhone;
      if(fallbackName) document.getElementById('loc_name').value = fallbackName;
    }
    if(parsed.address){
      const addrField = document.getElementById('loc_address');
      addrField.value = addrField.value.trim() ? (addrField.value.trim() + '\n' + parsed.address) : parsed.address;
    }
    statusEl.textContent = 'آدرس از عکس خونده شد ✓ — بررسی کن';
  }catch(e){
    statusEl.textContent = 'خطا در خواندن آدرس از عکس، دستی بنویس';
  }
  btn.disabled = false;
}

function showSimilarLocationSuggestions(){
  const wrap = document.getElementById('locSimilarSuggestions');
  if(!wrap) return;
  const addr = (document.getElementById('loc_address') || {}).value || '';
  if(addr.trim().length < 4){ wrap.innerHTML = ''; return; }
  const list = getSavedLocations();
  const scored = list
    .map(l => ({ l, score: textSimilarity(addr, l.address || '') }))
    .filter(x => x.score >= 0.3 && (x.l.region))
    .sort((a,b) => b.score - a.score)
    .slice(0, 3);
  if(scored.length === 0){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <div class="order-note" style="margin-top:2px;">شبیه به آدرس‌های قبلی:</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
      ${scored.map(x => `<button type="button" class="mini-btn" onclick="const el=document.getElementById('loc_region'); if(el) el.value='${escapeJs(x.l.region)}';">📍 ${escapeHtml(x.l.region)}</button>`).join('')}
    </div>
  `;
}

function guessRegionFromSimilarLocations(address){
  const list = getSavedLocations();
  let best = null, bestScore = 0;
  list.forEach(l => {
    if(!l.region) return;
    const score = textSimilarity(address, l.address || '');
    if(score > bestScore){ bestScore = score; best = l.region; }
  });
  return bestScore >= 0.3 ? best : null;
}

function saveLocationForm(id){
  let name = document.getElementById('loc_name').value.trim();
  let address = document.getElementById('loc_address').value.trim();
  let region = (document.getElementById('loc_region') || {}).value || '';
  region = region.trim();
  const mapLink = window._locFormMapLink || null;
  if(!address && !mapLink){
    toast('حداقل آدرس یا لینک نقشه رو وارد کن');
    return;
  }
  if(!address) address = '(بدون آدرس متنی — لینک نقشه موجوده)';
  if(!region && address && !(id && id.indexOf('loc_caesar_') === 0)){
    region = guessRegionFromSimilarLocations(address) || '';
  }
  if(!name){
    name = 'لوکیشن ' + new Date().toLocaleDateString('fa-IR-u-ca-gregory') + ' ' + new Date().toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' });
  }
  const list = getSavedLocations();
  if(id){
    const idx = list.findIndex(l => l.id === id);
    if(idx > -1) list[idx] = { ...list[idx], name, address, region, mapLink: mapLink || list[idx].mapLink || null };
  } else {
    const normAddr = address.trim().toLowerCase();
    const existingMatch = list.find(l =>
      (l.address || '').trim().toLowerCase() === normAddr ||
      (mapLink && l.mapLink && l.mapLink === mapLink)
    );
    if(existingMatch){
      const oldNameWasPlaceholder = /^لوکیشن /.test(existingMatch.name || '');
      const newNameIsReal = !/^لوکیشن /.test(name);
      if(oldNameWasPlaceholder && newNameIsReal){
        existingMatch.name = name;
      }
      existingMatch.address = address;
      if(region) existingMatch.region = region;
      if(mapLink) existingMatch.mapLink = mapLink;
      setSavedLocations(list);
      closeLocationForm();
      if(document.getElementById('locationsListWrap')) renderLocationsList();
      toast('این آدرس از قبل توی لیست بود — به‌جای تکراری، بروزرسانی شد');
      return;
    } else {
      list.push({ id: 'loc_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), name, address, region, mapLink });
    }
  }
  setSavedLocations(list);
  closeLocationForm();
  if(document.getElementById('locationsListWrap')) renderLocationsList();
  toast('ذخیره شد');
}

async function updateStorageUsageNote(){
  const el = document.getElementById('storageUsageNote');
  if(!el) return;
  let localBytes = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || '';
      localBytes += (k.length + v.length) * 2;
    }
  }catch(e){}
  let idbBytes = 0;
  try{
    const listRes = await idbStore.list(STORAGE_KEY_PREFIX);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    for(const k of keys){
      const r = await idbStore.get(k);
      if(r) idbBytes += (k.length + r.value.length) * 2;
    }
  }catch(e){}
  const mb = ((localBytes + idbBytes) / (1024*1024)).toFixed(1);
  el.textContent = 'در حال حاضر حدود ' + mb + ' مگابایت استفاده شده (سفارش‌ها روی حافظه‌ی پرظرفیت IndexedDB ذخیره می‌شن، پس جای نگرانی نیست).';
}

async function cleanupOldPhotos(){
  closeDuplicateConfirm();
  const today = todayKey();
  let cleanedDays = 0;
  try{
    const listRes = await idbStore.list(STORAGE_KEY_PREFIX);
    const keys = (listRes && listRes.keys) || [];
    for(const key of keys){
      if(key === today) continue;
      try{
        const r = await idbStore.get(key);
        if(!r) continue;
        const orders = JSON.parse(r.value);
        let changed = false;
        orders.forEach(o => {
          if(o.receiptPhoto){ o.receiptPhoto = null; o.receiptPhotoMedia = null; changed = true; }
          (o.payments || []).forEach(p => {
            if(p.posPhoto){ p.posPhoto = null; p.posMedia = null; changed = true; }
          });
        });
        if(changed){
          await idbStore.set(key, JSON.stringify(orders));
          cleanedDays++;
        }
      }catch(e){}
    }
  }catch(e){}
  toast(cleanedDays > 0 ? ('عکس‌های ' + cleanedDays + ' روز پاک شد ✓') : 'چیزی برای پاکسازی پیدا نشد');
  updateStorageUsageNote();
}

let qrScanStream = null;
let qrScanRafId = null;
let qrScanCallback = null;
let qrScanSkipCallback = null;
let qrScanStarting = false;

let nativeBarcodeDetector = null;
function hasNativeBarcodeDetector(){
  return typeof BarcodeDetector !== 'undefined';
}
function getBarcodeDetector(){
  if(!nativeBarcodeDetector){
    nativeBarcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
  }
  return nativeBarcodeDetector;
}

async function detectQrCode(canvas, imageData){
  if(hasNativeBarcodeDetector()){
    try{
      const results = await getBarcodeDetector().detect(canvas);
      if(results && results.length > 0 && results[0].rawValue){
        return results[0].rawValue;
      }
      return null;
    }catch(e){
      // fall through to jsQR below if native detector errors out
    }
  }
  if(typeof jsQR !== 'undefined' && imageData){
    try{
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      return (code && code.data) ? code.data : null;
    }catch(e){
      return null;
    }
  }
  return null;
}

function captureQrViaPhoto(onDetected, onSkip){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.style.display = 'none';
  document.body.appendChild(input);

  const cleanup = () => { if(input.parentNode) input.parentNode.removeChild(input); };

  input.onchange = async () => {
    const file = input.files[0];
    cleanup();
    if(!file){ if(onSkip) onSkip(); return; }
    toast('در حال بررسی عکس برای QR...');
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        let imageData = null;
        try{ imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }catch(e){}
        const result = await detectQrCode(canvas, imageData);
        if(result){
          toast('QR شناسایی شد ✓');
          onDetected(result);
        } else {
          toast('QR پیدا نشد، دوباره امتحان کن یا دستی وارد کن');
          if(onSkip) onSkip();
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function startQrScanner(onDetected, options){
  options = options || {};
  if(qrScanStream || qrScanStarting){
    return;
  }
  qrScanStarting = true;
  qrScanCallback = onDetected;
  qrScanSkipCallback = options.onSkip || null;
  if(typeof jsQR === 'undefined' && !hasNativeBarcodeDetector()){
    toast('اسکنر QR در دسترس نیست (نه مرورگر پشتیبانی می‌کنه، نه کتابخانه لود شد)');
    qrScanStarting = false;
    if(qrScanSkipCallback){ const cb = qrScanSkipCallback; qrScanSkipCallback = null; cb(); }
    return;
  }
  const canUseLiveCamera = window.isSecureContext !== false && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  if(!canUseLiveCamera){
    qrScanStarting = false;
    const cb = qrScanCallback;
    const skipCb = qrScanSkipCallback;
    qrScanCallback = null;
    qrScanSkipCallback = null;
    toast('دوربین زنده روی فایل محلی در دسترس نیست، عکس بگیر');
    captureQrViaPhoto(cb, skipCb);
    return;
  }

  const root = document.getElementById('modalRoot');
  root.insertAdjacentHTML('beforeend', `
  <div class="qr-scan-overlay" id="qrScanOverlay">
    <div class="qr-scan-video-wrap">
      <video id="qrScanVideo" autoplay playsinline muted></video>
      <div class="qr-scan-frame"></div>
      <div class="qr-scan-status" id="qrScanStatusText">در حال باز کردن دوربین...</div>
    </div>
    <div class="qr-scan-bar">
      ${options.allowSkip ? `<button onclick="skipQrScanner()" style="background:var(--card2);color:var(--text);border:1px solid var(--line);">رسید QR نداره، ورود دستی</button>` : ''}
      <button onclick="stopQrScanner()">لغو</button>
    </div>
  </div>`);

  try{
    qrScanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    toast('اجازه دسترسی به دوربین داده نشد');
    qrScanStarting = false;
    const skipCb = qrScanSkipCallback;
    stopQrScanner();
    if(skipCb) skipCb();
    return;
  }
  qrScanStarting = false;

  const video = document.getElementById('qrScanVideo');
  if(!video){
    stopQrScanner();
    return;
  }
  video.srcObject = qrScanStream;
  try{
    await video.play();
  }catch(e){
    // some browsers throw if play() races with pause(); scanning still proceeds once frames arrive
  }
  const statusEl0 = document.getElementById('qrScanStatusText');
  if(statusEl0) statusEl0.textContent = 'دوربین رو روی QR کد پایین رسید بگیر...';

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let frameBusy = false;

  const scanFrame = async () => {
    if(!qrScanStream) return;
    if(!frameBusy && video.readyState === video.HAVE_ENOUGH_DATA){
      frameBusy = true;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let imageData = null;
      try{ imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }catch(e){}
      const result = await detectQrCode(canvas, imageData);
      frameBusy = false;
      if(result){
        const cb = qrScanCallback;
        stopQrScanner();
        toast('QR شناسایی شد ✓');
        if(cb) cb(result);
        return;
      }
    }
    qrScanRafId = requestAnimationFrame(scanFrame);
  };
  qrScanRafId = requestAnimationFrame(scanFrame);
}

function stopQrScanner(){
  qrScanStarting = false;
  if(qrScanRafId){ cancelAnimationFrame(qrScanRafId); qrScanRafId = null; }
  if(qrScanStream){ qrScanStream.getTracks().forEach(t => t.stop()); qrScanStream = null; }
  document.querySelectorAll('#qrScanOverlay').forEach(el => el.remove());
  qrScanCallback = null;
  qrScanSkipCallback = null;
}

function skipQrScanner(){
  const cb = qrScanSkipCallback;
  stopQrScanner();
  if(cb) cb();
}

function normalizePhone(p){
  return String(p || '').replace(/\D/g, '');
}
function isRestaurantPhone(p){
  const n = normalizePhone(p);
  if(!n) return false;
  return RESTAURANT_PHONE_BLACKLIST.some(bl => n.endsWith(bl) || bl.endsWith(n));
}

async function findMatchingHistoryEntries(name, phone, address){
  const normPhone = normalizePhone(phone);
  const hasPhone = !!(normPhone && normPhone.length >= 6 && !isRestaurantPhone(phone));
  const normName = (name || '').trim().toLowerCase();
  const hasName = normName.length >= 2;
  const hasAddress = (address || '').trim().length >= 4;
  if(!hasPhone && !hasName && !hasAddress) return [];

  const candidates = [];
  try{
    const listRes = await idbStore.list(STORAGE_KEY_PREFIX);
    const keys = listRes && listRes.keys ? listRes.keys : [];
    for(const k of keys){
      try{
        const r = await idbStore.get(k);
        const orders = r ? JSON.parse(r.value) : [];
        orders.forEach(o => {
          if(!(o.address || '').trim()) return;

          let phoneMatch = false;
          if(hasPhone && o.phone && !isRestaurantPhone(o.phone) && normalizePhone(o.phone) === normPhone) phoneMatch = true;

          let nameMatch = false;
          if(hasName && o.name){
            const on = o.name.trim().toLowerCase();
            if(on === normName || on.includes(normName) || normName.includes(on)) nameMatch = true;
          }

          const addrSim = hasAddress ? textSimilarity(address, o.address) : 0;

          // Require at least two agreeing signals, or one very strong signal (phone, or near-identical address).
          const isMatch = phoneMatch || (nameMatch && addrSim >= 0.35) || addrSim >= 0.6;
          if(!isMatch) return;

          candidates.push({
            address: o.address, mapLink: o.mapLink || null, name: o.name || '', phone: o.phone || '',
            date: k.replace(STORAGE_KEY_PREFIX,''), time: o.time || '',
            score: (phoneMatch?3:0) + (nameMatch?2:0) + addrSim
          });
        });
      }catch(e){}
    }
  }catch(e){}

  candidates.sort((a,b) => b.score - a.score || ((a.date+a.time) < (b.date+b.time) ? 1 : -1));

  const unique = [];
  candidates.forEach(c => {
    const dup = unique.find(u => textSimilarity(u.address, c.address) >= 0.7);
    if(!dup) unique.push(c);
  });

  return unique.slice(0, 5);
}

function timeStringToMinutes(hhmm){
  if(!hhmm) return null;
  const m = String(hhmm).match(/(\d{1,2})[:.](\d{2})/);
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  if(h > 23 || mi > 59) return null;
  return h*60 + mi;
}

function nowMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

function getOrderElapsedMinutes(o){
  if(o.priority == null) return null;
  let elapsed = nowMinutes() - o.priority;
  if(elapsed < 0) elapsed += 24*60;
  return elapsed;
}

function minutesToDisplayTime(mins){
  const d = new Date();
  d.setHours(Math.floor(mins/60), mins%60, 0, 0);
  return d.toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' });
}

function currencySymbol(code){
  const c = CURRENCIES.find(x => x.code === code);
  return c ? c.symbol : '';
}

function getOrderPayments(o){
  if(o.payments && o.payments.length) return o.payments;
  if(o.payment) return [o.payment];
  return [];
}

function getOrderMismatch(o){
  if(o.paymentMismatch != null) return o.paymentMismatch;
  if(o.payment && o.payment.mismatch != null) return o.payment.mismatch;
  return null;
}

function render(){
  const dl = document.getElementById('dateLabel');
  dl.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long' }) + ', ' + todayKey().replace(STORAGE_KEY_PREFIX, '');
  dl.style.fontFamily = 'monospace';
  dl.style.direction = 'ltr';
  dl.style.textAlign = 'right';
  const vl = document.getElementById('versionLabel');
  if(vl) vl.textContent = '(' + APP_VERSION.split('·')[0].trim() + ')';

  const pending = currentOrders.filter(o => o.status !== 'delivered' && o.status !== 'cancelled').sort((a,b) => (a.priority||0) - (b.priority||0));
  const delivered = currentOrders.filter(o => o.status === 'delivered');
  const cancelled = currentOrders.filter(o => o.status === 'cancelled');

  let cashTotal = 0, cardTotal = 0, transferTotal = 0;
  const forexTotals = {};
  delivered.forEach(o => {
    getOrderPayments(o).forEach(p => {
      if(p.method === 'نقد') cashTotal += Number(p.amountTL) || 0;
      else if(p.method === 'کارت') cardTotal += Number(p.amountTL) || 0;
      else if(p.method === 'واریز') transferTotal += Number(p.amountTL) || 0;
      else if(p.method === 'ارز'){
        cashTotal += Number(p.tlEquivalent) || 0;
        forexTotals[p.currency] = (forexTotals[p.currency] || 0) + (Number(p.currencyAmount) || 0);
      }
    });
    if(o.changeGiven) cashTotal -= Number(o.changeGiven) || 0;
  });
  const tlTotal = cashTotal + cardTotal + transferTotal;

  document.getElementById('statQueue').textContent = pending.length;
  document.getElementById('statDelivered').textContent = delivered.length;
  document.getElementById('statTotal').textContent = fmt(tlTotal);
  document.getElementById('statCancelled').textContent = cancelled.length;
  const forexLineEl = document.getElementById('statForexLine');
  if(forexLineEl){
    const forexKeys = Object.keys(forexTotals);
    if(forexKeys.length > 0){
      forexLineEl.textContent = '+ ' + forexKeys.map(code => fmt(forexTotals[code]) + ' ' + currencySymbol(code)).join(' + ');
      forexLineEl.style.display = '';
    } else {
      forexLineEl.textContent = '';
      forexLineEl.style.display = 'none';
    }
  }
  renderReceivedPanel();

  const forexNote = document.getElementById('forexNote');
  const forexKeys = Object.keys(forexTotals);
  if(forexKeys.length){
    forexNote.style.display = 'block';
    forexNote.textContent = 'ارز خارجی: ' + forexKeys.map(k => fmt(forexTotals[k]) + currencySymbol(k)).join(' | ');
  } else {
    forexNote.style.display = 'none';
  }

  const main = document.getElementById('mainContent');
  let html = '';

  if(pending.length > 0){
    const active = pending[0];
    html += '<div class="section-label"><span>در حال تحویل</span></div>';
    html += activeOrderCard(active);

    const rest = pending.slice(1);
    if(rest.length > 0){
      html += '<div class="section-label"><span>صف بعدی (' + rest.length + ')</span></div>';
      html += rest.map((o, i) => queueOrderCard(o, i, rest.length)).join('');
    }
  }

  if(delivered.length > 0){
    html += '<div class="section-label"><span>تحویل داده‌شده امروز (' + delivered.length + ')</span></div>';
    html += delivered.slice().reverse().map(o => deliveredOrderCard(o)).join('');
  }

  main.innerHTML = html;
}

function paymentBadge(o){
  const payments = getOrderPayments(o);
  if(payments.length === 0) return '<span class="badge pending">در انتظار پرداخت</span>';
  const classMap = { 'نقد':'cash', 'کارت':'card', 'واریز':'transfer', 'ارز':'forex', 'آنلاین':'online', 'تیپ':'online' };
  let base = payments.map(p => {
    const cls = classMap[p.method] || 'src';
    const amtTxt = p.method === 'ارز' ? (fmt(p.currencyAmount) + currencySymbol(p.currency) + (p.tlEquivalent ? (' (≈' + fmt(p.tlEquivalent) + ' TL)') : ''))
      : (fmt(p.amountTL) + ' TL');
    return `<span class="badge ${cls}">${escapeHtml(p.method)} · ${amtTxt}</span>`;
  }).join(' ');
  if(o.changeGiven){
    base += ' <span class="badge cash">🔄 برگشتی: ' + fmt(o.changeGiven) + ' TL</span>';
  }
  const mismatch = getOrderMismatch(o);
  if(mismatch){

async function moveOrderPriority(id, dir){
  const pending = currentOrders.filter(o => o.status !== 'delivered' && o.status !== 'cancelled').sort((a,b) => (a.priority||0) - (b.priority||0));
  const idx = pending.findIndex(o => o.id === id);
  const swapIdx = idx + dir;
  if(idx < 0 || swapIdx < 0 || swapIdx >= pending.length) return;
  const tmp = pending[idx].priority;
  pending[idx].priority = pending[swapIdx].priority;
  pending[swapIdx].priority = tmp;
  await saveOrders();
  render();
  if(currentListView === 'queue') showQueueList();
}

function startMovingToOrder(orderId, app){
  const idx = currentOrders.findIndex(o => o.id === orderId);
  if(idx === -1) return;
  if(!currentOrders[idx].startedMovingAt){
    currentOrders[idx].startedMovingAt = Date.now();
    saveOrders();
  }
  const o = currentOrders[idx];
  const target = getNavQueryForAddress(o.address || '', o.mapLink);
  if(app === 'waze') openWaze(target);
  else if(app === 'google') openGoogleMapsExplicit(target);
  else openMap(target);
}

function recordArrivalLocation(orderId){
  if(!navigator.geolocation){
    toast('موقعیت‌یابی روی این مرورگر در دسترس نیست');
    return;
  }
  toast('در حال گرفتن موقعیت دقیق...');
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const accuracy = Math.round(pos.coords.accuracy || 0);
      const link = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;

      const idx = currentOrders.findIndex(x => x.id === orderId);
      if(idx === -1) return;
      currentOrders[idx] = { ...currentOrders[idx], mapLink: link, arrivalLat: lat, arrivalLng: lng };
      await saveOrders();
      render();
      toast('موقعیت دقیق ثبت شد (± ' + accuracy + ' متر)');
      offerSaveArrivalAsLocation(currentOrders[idx]);
    },
    (err) => {
      let msg = 'خطا در گرفتن موقعیت';
      if(err.code === 1) msg = 'اجازه دسترسی به موقعیت مکانی داده نشد';
      else if(err.code === 2) msg = 'موقعیت مکانی در دسترس نیست (GPS رو چک کن)';
      else if(err.code === 3) msg = 'زمان گرفتن موقعیت تموم شد، دوباره امتحان کن';
      toast(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function autoSaveAddressToLocations(name, address, mapLink){
  if(!(address || '').trim()) return;
  const list = getSavedLocations();
  const normAddr = address.trim().toLowerCase();
  const existingMatch = list.find(l =>
    (l.address || '').trim().toLowerCase() === normAddr ||
    (mapLink && l.mapLink && l.mapLink === mapLink)
  );
  if(existingMatch){
    if(mapLink && !existingMatch.mapLink) existingMatch.mapLink = mapLink;
  } else {
    list.push({
      id: 'loc_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      name: (name || '').trim() || ('لوکیشن ' + new Date().toLocaleDateString('fa-IR-u-ca-gregory')),
      address: address.trim(),
      mapLink: mapLink || null
    });
  }
  setSavedLocations(list);
}

const DRAFT_KEY = 'order_draft_v1';

function saveDraftNow(){
  if(editingId) return;
  const draft = {
    name: (document.getElementById('f_name')||{}).value || '',
    address: (document.getElementById('f_address')||{}).value || '',
    phone: (document.getElementById('f_phone')||{}).value || '',
    amount: (document.getElementById('f_amount')||{}).value || '',
    notes: (document.getElementById('f_notes')||{}).value || '',
    orderNo: (document.getElementById('f_orderno')||{}).value || '',
    items: (document.getElementById('f_items')||{}).value || '',
    source: getChipValue('srcGroup'),
    mapLink: capturedQrLink || null
  };
  const isEmpty = !draft.name && !draft.address && !draft.phone && !draft.amount && !draft.notes && !draft.orderNo && !draft.items && !draft.mapLink;
  if(isEmpty){
    localStorage.removeItem(DRAFT_KEY);
  } else {
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  }
}

let draftSaveTimer = null;
function scheduleDraftSave(){
  if(draftSaveTimer) clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(saveDraftNow, 500);
}

function getDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

function clearDraft(){
  localStorage.removeItem(DRAFT_KEY);
}

function discardDraftAndReopen(){

  const group = document.getElementById(groupId);
  group.querySelectorAll('.chip').forEach(btn => {
    if(btn.dataset.val === activeVal) btn.classList.add('active');
    btn.onclick = () => {
      group.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if(groupId === 'srcGroup') scheduleDraftSave();
    };
  });
}

function simpleHash(str){
  let h1 = 0, h2 = 0;
  const len = str.length;
  const step = Math.max(1, Math.floor(len / 4000));
  for(let i=0;i<len;i+=step){
    const c = str.charCodeAt(i);
    h1 = (h1 * 31 + c) | 0;
    h2 = (h2 * 131 + c) | 0;
  }
  return len + '_' + h1 + '_' + h2;
}

function findDuplicateOrder(){
  const excludeId = editingId;
  const orderNoVal = (document.getElementById('f_orderno') && document.getElementById('f_orderno').value.trim()) || '';
  const amountVal = Number((document.getElementById('f_amount') && document.getElementById('f_amount').value.replace(/[^0-9.]/g,'')) || 0);
  const phoneValRaw = (document.getElementById('f_phone') && document.getElementById('f_phone').value.trim()) || '';
  const phoneVal = isRestaurantPhone(phoneValRaw) ? '' : normalizePhone(phoneValRaw);

  for(const o of currentOrders){
    if(o.id === excludeId) continue;
    if(capturedPhotoHash && o.photoHash && o.photoHash === capturedPhotoHash) return { order: o, reason: 'همین عکس رسید قبلاً ثبت شده' };
    if(orderNoVal && o.orderNo && o.orderNo === orderNoVal) return { order: o, reason: 'شماره سفارش تکراریه' };
    const oPhone = isRestaurantPhone(o.phone) ? '' : normalizePhone(o.phone);
    if(amountVal > 0 && phoneVal && oPhone && Number(o.amount) === amountVal && oPhone === phoneVal) return { order: o, reason: 'مبلغ و تلفن با یک سفارش دیگه یکیه' };
  }
  return null;
}

function resizeImageDataUrl(dataUrl, maxDim){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if(width <= maxDim && height <= maxDim){
        resolve({ dataUrl, width, height });
        return;
      }
      const scale = Math.min(maxDim / width, maxDim / height);
      const newW = Math.round(width * scale);
      const newH = Math.round(height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = newW;
      canvas.height = newH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, newW, newH);
      resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.75), width: newW, height: newH });
    };
    img.onerror = () => resolve({ dataUrl, width: null, height: null });
    img.src = dataUrl;
  });
}

async function loadPhotoFromBlob(blob){
  capturedQrLink = null;
  capturedReceiptTime = null;
  capturedPaidOnlineHint = false;
  const reader = new FileReader();
  reader.onload = async () => {
    const originalDataUrl = reader.result;
    document.getElementById('photoPreviewWrap').innerHTML = `<img src="${originalDataUrl}" onclick="openImageLightbox(this.src)" style="cursor:zoom-in;"><div id="qrStatus" style="font-size:11.5px;color:var(--muted);margin-top:-4px;margin-bottom:6px;">در حال آماده‌سازی عکس...</div>`;

    const resized = await resizeImageDataUrl(originalDataUrl, 1280);
    const finalDataUrl = resized.dataUrl;
    capturedImageMedia = finalDataUrl.startsWith('data:image/jpeg') ? 'image/jpeg' : (blob.type || 'image/jpeg');
    capturedImageBase64 = finalDataUrl.split(',')[1];
    capturedPhotoHash = simpleHash(capturedImageBase64);

  };
  reader.readAsDataURL(blob);
}

function decodeQrFromImage(dataUrl){
  const img = new Image();
  img.onload = async () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    let imageData = null;
    try{ imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }catch(e){}
    const result = await detectQrCode(canvas, imageData);
    const statusEl = document.getElementById('qrStatus');
    if(result){
      capturedQrLink = result;
      if(statusEl) statusEl.innerHTML = '📍 لینک نقشه پیدا شد (این جدا از خوندن جزئیات سفارشه)';
      fillAddressPlaceholderFromQr();
    } else {
      if(statusEl) statusEl.textContent = 'QR کدی روی این عکس پیدا نشد';
    }
  };
  img.src = dataUrl;
}

function extractLatLngFromMapLink(link){
  if(!link) return null;
  const m = String(link).match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if(!m) return null;
  return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
}

function fillAddressPlaceholderFromQr(){
  const addrField = document.getElementById('f_address');
  if(!addrField || addrField.value.trim() || !capturedQrLink) return;
  const block = findCaesarBlockMatch(addrField.value) || null;
  const coords = extractLatLngFromMapLink(capturedQrLink);
  if(coords){
    addrField.value = '📍 فقط لینک نقشه از QR — آدرس متنی نداشت (' + coords.lat + ', ' + coords.lng + ')';
    updateSaveButtonState();
  }
}

function buildKmlFromLocations(locations){
  const esc = (s) => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const placemarks = locations.map(l => {
    const coords = extractLatLngFromMapLink(l.mapLink);
    const pointXml = coords ? `<Point><coordinates>${coords.lng},${coords.lat},0</coordinates></Point>` : '';
    const folder = l.group || 'سایر لوکیشن‌ها';
    return { folder, xml: `<Placemark>
      <name>${esc(l.name)}</name>
      <description>${esc(l.address || '')}${l.mapLink && !coords ? ' | لینک نقشه: ' + esc(l.mapLink) : ''}</description>
      ${pointXml}
    </Placemark>` };
  });
  const folders = {};
  placemarks.forEach(p => {
    if(!folders[p.folder]) folders[p.folder] = [];
    folders[p.folder].push(p.xml);
  });
  const folderXml = Object.keys(folders).map(name =>
    `<Folder><name>${esc(name)}</name>${folders[name].join('\n')}</Folder>`
  ).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
<name>پیک سوشین - لوکیشن‌های ذخیره‌شده</name>
${folderXml}
</Document>
</kml>`;
}

function exportLocationsKml(){
  const locations = getSavedLocations();
  if(locations.length === 0){ toast('لوکیشنی برای خروجی نیست'); return; }
  const withCoords = locations.filter(l => extractLatLngFromMapLink(l.mapLink)).length;
  const kml = buildKmlFromLocations(locations);
  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'peyk-locations.kml';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(withCoords + ' از ' + locations.length + ' تا با پین دقیق، بقیه فقط متنی — توی Map Marker وارد کن');
}

function mapUrlFor(text){
  const t = (text || '').trim();
  if(!t) return null;
  const urlMatch = t.match(/https?:\/\/\S+/);
  if(urlMatch && /maps\.google\.|google\.[a-z.]+\/maps|goo\.gl|maps\.app\.goo\.gl/i.test(urlMatch[0])){
    return urlMatch[0];
  }
  const coordMatch = t.match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if(coordMatch){
    return 'https://www.google.com/maps/search/?api=1&query=' + coordMatch[1] + ',' + coordMatch[2];
  }
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t);
}

function wazeUrlFor(text){
  const t = (text || '').trim();
  if(!t) return null;
  const coordMatch = t.match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if(coordMatch){
    return 'https://waze.com/ul?ll=' + coordMatch[1] + ',' + coordMatch[2] + '&navigate=yes';
  }
  return 'https://waze.com/ul?q=' + encodeURIComponent(t) + '&navigate=yes';
}

function openGoogleMapsExplicit(address){
  const url = mapUrlFor(address);
  if(!url){ toast('آدرسی برای این سفارش ثبت نشده'); return; }
  window.open(url, '_blank');
}

function normalizePhoneForDialing(phone){
  let digits = String(phone || '').replace(/\D/g, '');
  if(!digits) return null;
  if(digits.startsWith('0')) digits = '90' + digits.slice(1);
  else if(digits.length === 10 && !digits.startsWith('90')) digits = '90' + digits;
  return digits;
}

  window.location.href = 'tel:' + o.phone.trim();
}

function whatsappOrderCustomer(id){

  window.open('https://wa.me/' + digits, '_blank');
}

نوع پرداخت (نقد/کارت) را استخراج نکن، چون قابل اعتماد نیست و بعداً موقع تحویل توسط پیک ثبت می‌شود. ولی اگه خود رسید صریحاً نشون می‌ده که سفارش از قبل و آنلاین پرداخت شده (مثلاً نوشته "Online Ödeme"، "Ödendi"، "Kredi Kartı (Online)" یا هر عبارت مشابهی که یعنی پول از قبل گرفته شده و پیک نیازی به دریافت وجه نداره)، این رو توی فیلد paidOnline مشخص کن.
اطلاعات زیر را استخراج کن و فقط یک JSON خام (بدون توضیح، بدون markdown) با این کلیدها برگردان:
{"isReceipt": true یا false, "name": "نام مشتری، یا برای RIOVERDE: Masa <شماره میز>", "address": "آدرس کامل، اگر جمله‌ای در متن تکرار شده حذفش کن و فقط یک بار بنویس", "phone": "شماره تلفن مشتری یا خالی", "amount": عدد مبلغ نهایی قابل پرداخت بدون واحد, "source": "Feed Me یا تلفن رستوران", "notes": "تمام یادداشت‌ها و توضیحات نوشته‌شده روی رسید (چه چاپی چه دست‌نویس) رو کامل و بدون خلاصه‌کردن بردار — نه فقط بخشی از اون. اگه به ترکی یا زبان دیگه‌ای نوشته شده، کل متن رو کامل به فارسی ترجمه کن، چیزی رو حذف یا کوتاه نکن", "orderNo": "شماره سفارش (Sip. No) یا خالی", "items": "لیست کامل اقلام سفارش با تعداد و قیمت هرکدوم، خط به خط، دقیقا مطابق رسید", "orderTime": "ساعت سفارش به فرمت HH:MM از روی خود رسید، یا خالی اگه پیدا نشد", "paidOnline": true یا false — فقط اگه رسید صریحاً نشون بده از قبل آنلاین پرداخت شده، وگرنه false}
اگر مبلغی به صورت دست‌نویس یا در پایین رسید نوشته شده (مثل Yalnız ... 'dir) همان را به عنوان مبلغ نهایی در نظر بگیر. آدرس یا تلفن دست‌نویس را هم اگر بود لحاظ کن. فقط JSON خام برگردان.`;
}

function applyExtractedFields(parsed){
  if(parsed.isReceipt === false){
    return false;
  }
  if(parsed.paidOnline === true) capturedPaidOnlineHint = true;
  if(parsed.orderTime){
    const mins = timeStringToMinutes(parsed.orderTime);
    if(mins != null) capturedReceiptTime = mins;
  }
  if(parsed.name) document.getElementById('f_name').value = parsed.name;
  if(parsed.address) document.getElementById('f_address').value = parsed.address;
  if(parsed.phone) document.getElementById('f_phone').value = parsed.phone;
  if(parsed.amount) document.getElementById('f_amount').value = Math.round(Number(parsed.amount));
  if(parsed.notes) document.getElementById('f_notes').value = parsed.notes;
  if(parsed.orderNo) document.getElementById('f_orderno').value = parsed.orderNo;
  if(parsed.items) document.getElementById('f_items').value = parsed.items;
  if(parsed.source){
    document.querySelectorAll('#srcGroup .chip').forEach(b=>{
      b.classList.toggle('active', b.dataset.val === parsed.source);
    });
  }
  showDuplicateWarning(findDuplicateOrder());
  checkCaesarBlockMatch();
  scheduleCustomerCheck();
  return true;
}

  type: "OBJECT",
  properties: {
    isReceipt: { type: "BOOLEAN" },
    paidOnline: { type: "BOOLEAN" },
    name: { type: "STRING" },
    address: { type: "STRING" },
    phone: { type: "STRING" },
    amount: { type: "NUMBER" },
    source: { type: "STRING" },
    notes: { type: "STRING" },

  }
};

async function runAutoExtract(){
  if(!capturedImageBase64) return;
  if(getGeminiKey()){
    const ok = await runGeminiExtract();
    if(ok) return;
  }
  if(getNvidiaKey()){
    const ok = await runNvidiaExtract();
    if(ok) return;
  }
}

async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try{
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function runGeminiExtract(){
  if(!capturedImageBase64) return;
  const statusEl = document.getElementById('aiStatus');
  const btn = document.getElementById('geminiBtn');

  const apiKey = getGeminiKey();
  if(!apiKey){
    statusEl.innerHTML = '⚠ اول یه کلید Gemini توی «تنظیمات» ذخیره کن.';
    return;
  }

  if(btn) btn.disabled = true;
  statusEl.textContent = 'در حال خواندن با Gemini...';

  try{
    const response = await fetchWithTimeout("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey
      },
      body: JSON.stringify({
        contents: [{
          parts: [
            { inline_data: { mime_type: capturedImageMedia, data: capturedImageBase64 } },
            { text: buildReceiptPrompt() }
          ]
        }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: GEMINI_SCHEMA
        }
      })
    }, 12000);

    if(!response.ok){
      if(response.status === 401 || response.status === 403){
        statusEl.innerHTML = '⚠ کلید Gemini نامعتبره، توی تنظیمات چکش کن.';
      } else if(response.status === 429){
        statusEl.textContent = 'محدودیت رایگان امروز پر شده، چند لحظه صبر کن یا فردا دوباره امتحان کن.';
      } else if(response.status === 404){
        statusEl.innerHTML = '⚠ گوگل این مدل رو تغییر داده (نه مشکل کلید تو). به کلود بگو رفعش کنه.';
      } else if(response.status === 400){
        statusEl.textContent = 'درخواست رد شد (400) — یا کلید اشتباهه یا عکس مشکل داره.';
      } else {
        statusEl.textContent = 'خطا در سرور Gemini (' + response.status + ')، دستی وارد کن.';
      }
      if(btn) btn.disabled = false;
      fillAddressPlaceholderFromQr();
      return false;
    }

    const data = await response.json();
    const rawText = data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] ?
      data.candidates[0].content.parts[0].text : '';
    const parsed = JSON.parse(rawText);
    const ok = applyExtractedFields(parsed);
    statusEl.textContent = ok ? 'خونده شد (Gemini، رایگان) — بررسی کن.' : '⚠ این عکس فیش سفارش به نظر نمی‌رسه — عکس دیگه‌ای امتحان کن یا دستی وارد کن.';
    if(ok){
      fillAddressPlaceholderFromQr();
      showReadConfirmDialog();
    } else {
      updateSaveButtonState();
    }
    if(btn) btn.disabled = false;
    return ok;
  }catch(e){
    statusEl.textContent = e && e.name === 'AbortError'
      ? '⚠ Gemini خیلی طول کشید، رفتیم سراغ گزینه‌ی بعدی...'
      : '⚠ خواندن جزئیات سفارش با خطا مواجه شد (اینترنت رو چک کن) — دکمه‌ی «تلاش دوباره» رو بزن یا دستی وارد کن. توجه: اگه لینک نقشه بالا سبز شده، اون جدا و درست ثبت شده.';
    fillAddressPlaceholderFromQr();
    if(btn) btn.disabled = false;
    return false;
  }
}

async function runAiExtract(){
  if(!capturedImageBase64) return;
  const statusEl = document.getElementById('aiStatus');
  const aiBtn = document.getElementById('aiBtn');

  const apiKey = getApiKey();
  if(!apiKey){
    statusEl.innerHTML = '⚠ اول یه کلید API توی «تنظیمات» ذخیره کن.';
    return;
  }

  aiBtn.disabled = true;
  statusEl.textContent = 'در حال خواندن رسید...';

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: capturedImageMedia, data: capturedImageBase64 } },
            { type: "text", text: buildReceiptPrompt() }
          ]
        }]
      })
    });

    if(!response.ok){
      if(response.status === 401){

      }
      aiBtn.disabled = false;
      fillAddressPlaceholderFromQr();
      return;
    }

    const data = await response.json();
    const textBlock = (data.content || []).find(c => c.type === 'text');
    let raw = textBlock ? textBlock.text : '';
    raw = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    const ok = applyExtractedFields(parsed);

    let usageNote = '';
    if(data.usage){
      const stats = addUsage(data.usage.input_tokens, data.usage.output_tokens);
      usageNote = ' (مصرف تا الان: $' + stats.costUSD.toFixed(3) + ')';
    }
    statusEl.textContent = ok ? ('خونده شد — بررسی کن.' + usageNote) : '⚠ این عکس فیش سفارش به نظر نمی‌رسه — عکس دیگه‌ای امتحان کن یا دستی وارد کن.';
    if(ok){
      fillAddressPlaceholderFromQr();
      showReadConfirmDialog();
    } else {
      updateSaveButtonState();
    }
  }catch(e){
    statusEl.textContent = '⚠ خواندن جزئیات سفارش با خطا مواجه شد (اینترنت رو چک کن) — دکمه‌ی «تلاش دوباره» رو بزن یا دستی وارد کن. توجه: اگه لینک نقشه بالا سبز شده، اون جدا و درست ثبت شده.';
    fillAddressPlaceholderFromQr();
  }
  aiBtn.disabled = false;
}

function updateSaveButtonState(){
  const btn = document.getElementById('orderSaveBtn');
  if(!btn) return;
  const name = ((document.getElementById('f_name')||{}).value || '').trim();
  const address = ((document.getElementById('f_address')||{}).value || '').trim();

async function saveOrderForm(forceSave){
  const name = document.getElementById('f_name').value.trim();
  const address = document.getElementById('f_address').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const amount = Number(document.getElementById('f_amount').value.replace(/[^0-9.]/g,'')) || 0;
  const notes = document.getElementById('f_notes').value.trim();
  const orderNo = document.getElementById('f_orderno').value.trim();
  const items = document.getElementById('f_items').value.trim();
  const source = getChipValue('srcGroup');
  const existingForEdit = editingId ? currentOrders.find(x=>x.id===editingId) : null;
  const mapLink = capturedQrLink || (existingForEdit ? existingForEdit.mapLink : null) || null;
  const photoHash = capturedPhotoHash || (existingForEdit ? existingForEdit.photoHash : null) || null;
  const receiptPhoto = capturedImageBase64 || (existingForEdit ? existingForEdit.receiptPhoto : null) || null;
  const receiptPhotoMedia = capturedImageBase64 ? capturedImageMedia : (existingForEdit ? existingForEdit.receiptPhotoMedia : null) || null;

  if(!address && !name && !capturedImageBase64 && !mapLink){
    toast('حداقل یه چیز (نام، آدرس یا عکس رسید) لازمه');
    return;
  }
  const incomplete = !address || !name || amount <= 0;
  if(incomplete){
    toast(amount <= 0 ? 'ثبت شد (بدون مبلغ) — بعداً کاملش کن' : 'ثبت شد (ناقص) — بعداً کاملش کن');
  }

  if(!forceSave){
    const dup = findDuplicateOrder();
    if(dup){
      confirmDuplicateSave(dup);
      return;
    }
  }

  const editIdx = editingId ? currentOrders.findIndex(x => x.id === editingId) : -1;
  if(editingId && editIdx > -1){
    currentOrders[editIdx] = { ...currentOrders[editIdx], name, address, phone, amount, source, notes, orderNo, items, mapLink, photoHash, incomplete, receiptPhoto, receiptPhotoMedia, paidOnlineHint: capturedPaidOnlineHint || currentOrders[editIdx].paidOnlineHint || false };
  } else {
    const priorityValue = capturedReceiptTime != null ? capturedReceiptTime : nowMinutes();
    const displayTime = capturedReceiptTime != null ? minutesToDisplayTime(capturedReceiptTime) : new Date().toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' });
    const newId = 'o_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    currentOrders.push({
      id: newId,
      time: displayTime,
      name, address, phone, amount, source, notes, orderNo, items, mapLink, photoHash, incomplete, receiptPhoto, receiptPhotoMedia,
      paidOnlineHint: capturedPaidOnlineHint,
      status: 'pending', priority: priorityValue, payment: null
    });
  }
  await saveOrders();
  clearDraft();
  finishOrderFormSave();
  if(!incomplete) toast('سفارش ذخیره شد');
}

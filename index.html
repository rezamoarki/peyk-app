function legacyPaymentToDraft(o){
  const draft = {
    online: { used: !!o.paidOnlineHint, amountTL:'', note:'', posPhoto:null, posMedia:null },
    cardUsed: false,
    cards: [{ amountTL:'', posPhoto:null, posMedia:null }],
    cashUsed: false,
    cashTL: '',
    forex: [],
    transferUsed: false,
    transfer: { amountTL:'', note:'', posPhoto:null, posMedia:null },
    changeGiven: ''
  };
  const payments = getOrderPayments(o);
  let firstCard = true;
  payments.forEach(p => {
    if(!p || !p.method) return;
    if(p.method === 'آنلاین'){
      draft.online = { used:true, amountTL: p.amountTL!=null?p.amountTL:'', note:p.note||'', posPhoto:p.posPhoto||null, posMedia:p.posMedia||null };
    } else if(p.method === 'کارت'){
      draft.cardUsed = true;
      if(firstCard){ draft.cards = []; firstCard = false; }
      draft.cards.push({ amountTL: p.amountTL, posPhoto:p.posPhoto||null, posMedia:p.posMedia||null });
    } else if(p.method === 'نقد'){
      draft.cashUsed = true;
      draft.cashTL = p.grossAmountTL != null ? p.grossAmountTL : p.amountTL;
      if(p.changeGiven) draft.changeGiven = p.changeGiven;
    } else if(p.method === 'ارز'){
      draft.cashUsed = true;
      draft.forex.push({ currency: p.currency, amount: p.currencyAmount, rate: p.rate || '' });
    } else if(p.method === 'واریز'){
      draft.transferUsed = true;
      draft.transfer = { amountTL: p.amountTL, note: p.note||'', posPhoto:p.posPhoto||null, posMedia:p.posMedia||null };
    }
  });
  if(draft.cards.length === 0) draft.cards.push({ amountTL:'', posPhoto:null, posMedia:null });
  return draft;
}

function onPaymentPhotoSelected(evt, key){
  const file = evt.target.files[0];
  if(!file) return;
  syncPaymentDraftFromDom();
  const reader = new FileReader();
  reader.onload = async () => {
    const originalDataUrl = reader.result;
    const wrap = document.getElementById('payPhotoPreview_' + key);
    if(wrap) wrap.innerHTML = `<img src="${originalDataUrl}" onclick="openImageLightbox(this.src)" style="cursor:zoom-in;">`;
    const resized = await resizeImageDataUrl(originalDataUrl, 1280);
    if(!window._paymentPhotos) window._paymentPhotos = {};
    window._paymentPhotos[key] = {
      media: resized.dataUrl.startsWith('data:image/jpeg') ? 'image/jpeg' : (file.type || 'image/jpeg'),
      base64: resized.dataUrl.split(',')[1]
    };
    if(key.indexOf('card_') === 0){
      syncPaymentDraftFromDom();
      renderPaymentSections();
      runPaymentPhotoAmountRead(key);
    }
  };
  reader.readAsDataURL(file);
}

async function runPaymentPhotoAmountRead(key){
  const geminiKey = getGeminiKey();
  const statusEl = document.getElementById('payPhotoStatus_' + key);
  if(!geminiKey){
    if(statusEl) statusEl.textContent = 'برای خوندن خودکار مبلغ، اول یه کلید Gemini توی تنظیمات ذخیره کن.';
    return;
  }
  const photo = window._paymentPhotos && window._paymentPhotos[key];
  if(!photo){
    if(statusEl) statusEl.textContent = 'اول عکس فیش رو بگیر.';
    return;
  }
  const idx = Number(key.replace('card_', ''));
  if(statusEl) statusEl.textContent = 'در حال خواندن مبلغ...';

  const prompt = `این عکس یک فیش دستگاه پوز (کارت‌خوان) است. فقط مبلغ نهایی پرداخت‌شده (به لیر ترکیه) رو از روش پیدا کن — هیچی حدس نزن. اگه واضح نبود یا اصلاً فیش پوز نبود، amount رو صفر بذار. فقط یک JSON خام برگردون: {"amount": عدد}`;

  try{
    const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": geminiKey },
      body: JSON.stringify({
        contents: [{ parts: [
          { inline_data: { mime_type: photo.media, data: photo.base64 } },
          { text: prompt }
        ]}],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: { type:"OBJECT", properties: { amount:{ type:"NUMBER" } } }
        }
      })
    });
    if(!response.ok){
      if(statusEl) statusEl.textContent = '⚠ خطا در اتصال (اینترنت رو چک کن) — دکمه‌ی «تلاش دوباره» رو بزن یا دستی وارد کن.';
      return;
    }
    const data = await response.json();
    const rawText = data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] ?
      data.candidates[0].content.parts[0].text : '';
    const parsed = JSON.parse(rawText);
    if(parsed.amount && parsed.amount > 0 && paymentDraft && paymentDraft.cards[idx]){
      syncPaymentDraftFromDom();
      paymentDraft.cards[idx].amountTL = Math.round(parsed.amount);
      renderPaymentSections();
      toast('مبلغ از روی فیش پوز خونده شد ✓ — بررسی کن');
    } else if(statusEl){
      statusEl.textContent = 'مبلغی روی این عکس پیدا نشد — دستی وارد کن یا دوباره امتحان کن.';
    }
  }catch(e){
    if(statusEl) statusEl.textContent = '⚠ خطا در اتصال (اینترنت رو چک کن) — دکمه‌ی «تلاش دوباره» رو بزن یا دستی وارد کن.';
  }
}

function syncPaymentDraftFromDom(){
  const d = paymentDraft;
  if(!d) return;
  const onlineUsed = document.getElementById('pay_online_used');
  if(onlineUsed) d.online.used = onlineUsed.checked;
  const onlineAmount = document.getElementById('pay_online_amount');
  if(onlineAmount) d.online.amountTL = onlineAmount.value;
  const onlineNote = document.getElementById('pay_online_note');
  if(onlineNote) d.online.note = onlineNote.value;

  const cardUsedEl = document.getElementById('pay_card_used');
  if(cardUsedEl) d.cardUsed = cardUsedEl.checked;
  const cashUsedEl = document.getElementById('pay_cash_used');
  if(cashUsedEl) d.cashUsed = cashUsedEl.checked;
  const transferUsedEl = document.getElementById('pay_transfer_used');
  if(transferUsedEl) d.transferUsed = transferUsedEl.checked;

  document.querySelectorAll('.card-amount').forEach(el => {
    const i = Number(el.dataset.idx);
    if(d.cards[i]) d.cards[i].amountTL = el.value;
  });

  const cashTl = document.getElementById('pay_cash_tl');
  if(cashTl) d.cashTL = cashTl.value;

  document.querySelectorAll('.forex-currency').forEach(el => {
    const i = Number(el.dataset.idx);
    if(d.forex[i]) d.forex[i].currency = el.value;
  });
  document.querySelectorAll('.forex-amount').forEach(el => {
    const i = Number(el.dataset.idx);
    if(d.forex[i]) d.forex[i].amount = el.value;
  });
  document.querySelectorAll('.forex-rate').forEach(el => {
    const i = Number(el.dataset.idx);
    if(d.forex[i]) d.forex[i].rate = el.value;
  });

  const transferTl = document.getElementById('pay_transfer_tl');
  if(transferTl) d.transfer.amountTL = transferTl.value;
  const transferNote = document.getElementById('pay_transfer_note');
  if(transferNote) d.transfer.note = transferNote.value;

  const changeEl = document.getElementById('pay_change_given');
  if(changeEl) d.changeGiven = changeEl.value;
}

function updatePaymentBalanceIndicator(){
  const el = document.getElementById('paymentBalanceIndicator');
  if(!el) return;
  const o = currentOrders.find(x => x.id === payingOrderId);
  if(!o) return;

  let tlSum = 0;
  const onlineAmountEl = document.getElementById('pay_online_amount');
  if(onlineAmountEl) tlSum += Number(String(onlineAmountEl.value||'').replace(/[^0-9.]/g,'')) || 0;
  document.querySelectorAll('.card-amount').forEach(inp => {
    tlSum += Number(String(inp.value||'').replace(/[^0-9.]/g,'')) || 0;
  });
  const cashEl = document.getElementById('pay_cash_tl');
  if(cashEl) tlSum += Number(String(cashEl.value||'').replace(/[^0-9.]/g,'')) || 0;
  const transferEl = document.getElementById('pay_transfer_tl');
  if(transferEl) tlSum += Number(String(transferEl.value||'').replace(/[^0-9.]/g,'')) || 0;

  const forexAmounts = document.querySelectorAll('.forex-amount');
  const forexRates = document.querySelectorAll('.forex-rate');
  forexAmounts.forEach((inp, i) => {
    const amt = Number(String(inp.value||'').replace(/[^0-9.]/g,'')) || 0;
    const rate = forexRates[i] ? (Number(String(forexRates[i].value||'').replace(/[^0-9.]/g,'')) || 0) : 0;
    tlSum += Math.round(amt * rate);
  });

  const changeEl = document.getElementById('pay_change_given');
  const changeAmt = changeEl ? (Number(String(changeEl.value||'').replace(/[^0-9.]/g,'')) || 0) : 0;
  tlSum -= changeAmt;

  const diff = Math.round(tlSum - (Number(o.amount) || 0));
  let color, text;
  if(diff < 0){ color = 'var(--red)'; text = fmt(diff) + ' TL'; }
  else if(diff === 0){ color = 'var(--text)'; text = '0 TL'; }
  else { color = 'var(--teal)'; text = '+' + fmt(diff) + ' TL'; }
  el.style.color = color;
  el.textContent = 'مانده: ' + text;
}

function calcCashChange(){
  const o = currentOrders.find(x => x.id === payingOrderId);
  const receiptAmount = o ? (Number(o.amount) || 0) : 0;
  const handedField = document.getElementById('cash_handed_over');
  const statusEl = document.getElementById('cashChangeStatus');
  if(!statusEl || !handedField) return;
  const handed = Number(String(handedField.value || '').replace(/[^0-9.]/g,'')) || 0;
  if(handed <= 0){ statusEl.innerHTML = ''; return; }

  const change = Math.round(handed - receiptAmount);
  if(change > 0){
    statusEl.innerHTML = 'باید ' + fmt(change) + ' TL بابت مانده بهش پس بدی. <span style="text-decoration:underline;cursor:pointer;color:var(--amber);" onclick="applyCashChange(' + handed + ',' + change + ')">اعمال به فرم</span>';
  } else if(change < 0){
    statusEl.textContent = 'این مبلغ ' + fmt(Math.abs(change)) + ' TL کمتر از فیشه — یا اشتباه تایپ کردی، یا باید بقیه‌ش رو با روش دیگه بگیری.';
  } else {
    statusEl.innerHTML = 'دقیقاً جوره، مانده‌ای نیست. <span style="text-decoration:underline;cursor:pointer;color:var(--amber);" onclick="applyCashChange(' + handed + ',0)">اعمال به فرم</span>';
  }
}

async function fetchTcmbRate(currencyCode){
  try{
    const res = await fetch('https://www.tcmb.gov.tr/kurlar/today.xml');
    if(!res.ok) return null;
    const text = await res.text();
    const xml = new DOMParser().parseFromString(text, 'text/xml');
    const nodes = xml.getElementsByTagName('Currency');
    for(let i=0;i<nodes.length;i++){
      if(nodes[i].getAttribute('Kod') === currencyCode || nodes[i].getAttribute('CurrencyCode') === currencyCode){
        const buying = nodes[i].getElementsByTagName('ForexBuying')[0];
        if(buying && buying.textContent) return parseFloat(buying.textContent);
      }
    }
    return null;
  }catch(e){
    return null;
  }
}

async function fetchFrankfurterRate(currencyCode){
  try{
    const res = await fetch('https://api.frankfurter.app/latest?from=' + currencyCode + '&to=TRY');
    if(!res.ok) return null;
    const data = await res.json();
    return data && data.rates && data.rates.TRY ? data.rates.TRY : null;
  }catch(e){
    return null;
  }
}

async function fetchExchangeRateToTRY(currencyCode){
  const tcmb = await fetchTcmbRate(currencyCode);
  if(tcmb) return { rate: tcmb, source: 'بانک مرکزی ترکیه' };
  const fallback = await fetchFrankfurterRate(currencyCode);
  if(fallback) return { rate: fallback, source: 'نرخ بازار (جایگزین چون بانک مرکزی در دسترس نبود)' };
  return null;
}

async function fetchAndApplyRate(i){

  const statusEl = document.getElementById('forex_status_' + i);
  if(statusEl) statusEl.textContent = 'در حال گرفتن نرخ روز...';
  const result = await fetchExchangeRateToTRY(entry.currency);
  if(result){
    entry.rate = result.rate;
    renderPaymentSections();
    toast('نرخ روز گرفته شد (' + result.source + ')');
  } else {
    if(statusEl) statusEl.textContent = 'نرخ روز پیدا نشد — دستی وارد کن';
    toast('نتونستم نرخ روز رو بگیرم، دستی وارد کن');
  }
}

      <input type="text" inputmode="numeric" class="amount-input" id="pay_transfer_tl" value="${(d.transfer.amountTL!=null && d.transfer.amountTL!=='') ? d.transfer.amountTL : (o.amount||'')}" oninput="updatePaymentBalanceIndicator()" style="margin-top:8px;">
      ${photoBlockHtml('transfer', d.transfer, 'عکس فیش واریز (اختیاری)')}
      <label>یادداشت (اختیاری)</label>
      <textarea id="pay_transfer_note" style="min-height:36px;">${escapeHtml(d.transfer.note||'')}</textarea>
      ` : ''}
    </div>
  </div>
  `;

  wrap.innerHTML = html;
  updatePaymentBalanceIndicator();
}

async function confirmDelivery(){
 try{
  syncPaymentDraftFromDom();
  const o = currentOrders.find(x => x.id === payingOrderId);
  if(!o) return;
  const d = paymentDraft;

  const finalPayments = [];
  let tlSum = 0;

  if(d.online.used){
    const photo = window._paymentPhotos.online;
    const onlineAmt = Number(String(d.online.amountTL||'').replace(/[^0-9.]/g,'')) || 0;
    finalPayments.push({
      method: 'آنلاین',
      amountTL: onlineAmt,
      note: (d.online.note||'').trim(),
      posPhoto: (photo && photo.base64) || null,
      posMedia: (photo && photo.media) || null
    });
    tlSum += onlineAmt;
  }

  for(let i=0;i<d.cards.length;i++){
    const c = d.cards[i];
    const amt = Number(String(c.amountTL||'').replace(/[^0-9.]/g,'')) || 0;
    if(amt <= 0) continue;
    const photo = window._paymentPhotos['card_'+i];
    finalPayments.push({
      method: 'کارت',
      amountTL: amt,
      posPhoto: (photo && photo.base64) || null,
      posMedia: (photo && photo.media) || null
    });
    tlSum += amt;
  }

  const cashAmt = Number(String(d.cashTL||'').replace(/[^0-9.]/g,'')) || 0;
  if(cashAmt > 0){
    finalPayments.push({ method: 'نقد', amountTL: cashAmt, grossAmountTL: cashAmt });
    tlSum += cashAmt;
  }

  for(let i=0;i<d.forex.length;i++){
    const f = d.forex[i];
    const amt = Number(String(f.amount||'').replace(/[^0-9.]/g,'')) || 0;
    if(amt <= 0) continue;
    const rate = Number(String(f.rate||'').replace(/[^0-9.]/g,'')) || 0;
    if(rate <= 0){
      toast('نرخ تبدیل ارز ' + f.currency + ' وارد نشده — نرخ روز رو بگیر یا دستی بزن');
      return;
    }
    const tlEquivalent = Math.round(amt * rate);
    finalPayments.push({ method: 'ارز', currency: f.currency, currencyAmount: amt, rate: rate, tlEquivalent: tlEquivalent });
    tlSum += tlEquivalent;
  }

  const transferAmt = Number(String(d.transfer.amountTL||'').replace(/[^0-9.]/g,'')) || 0;
  if(transferAmt > 0){
    const photo = window._paymentPhotos.transfer;
    finalPayments.push({
      method: 'واریز',
      amountTL: transferAmt,
      note: (d.transfer.note||'').trim(),
      posPhoto: (photo && photo.base64) || null,
      posMedia: (photo && photo.media) || null
    });
    tlSum += transferAmt;
  }

  const changeAmt = Math.round(Number(String(d.changeGiven||'').replace(/[^0-9.]/g,'')) || 0);
  if(changeAmt > 0){
    tlSum -= changeAmt;
    if(finalPayments.length === 0){
      toast('اول یه روش پرداخت رو پر کن، بعد مبلغ برگشتی رو بزن');
      return;
    }
  }

  if(finalPayments.length === 0){
    toast('حداقل یه روش پرداخت رو پر کن');
    return;
  }

  const hasTLCollectionRow = finalPayments.some(p => p.method === 'نقد' || p.method === 'کارت' || p.method === 'واریز' || p.method === 'ارز' || p.method === 'آنلاین');
  let mismatch = null;
  if(hasTLCollectionRow && (o.amount || 0) > 0 && Math.abs(tlSum - o.amount) >= 1){
    mismatch = Math.round(tlSum - o.amount);
  }

  const idx = currentOrders.findIndex(x => x.id === payingOrderId);
  const startedAt = currentOrders[idx].startedMovingAt;
  currentOrders[idx] = {
    ...currentOrders[idx],
    status: 'delivered',
    payments: finalPayments,
    payment: null,
    paymentMismatch: mismatch,
    changeGiven: changeAmt || null,
    deliveredAt: new Date().toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' }),
    deliveredAtTs: Date.now(),
    deliveryDurationMin: startedAt ? Math.max(0, Math.round((Date.now() - startedAt) / 60000)) : null
  };
  await saveOrders();
  refreshAfterOrderChange();

  const nextPending = currentOrders.filter(x => x.status !== 'delivered').sort((a,b) => (a.priority||0)-(b.priority||0));
  let mismatchNote = '';
  if(mismatch){
    const sign = mismatch > 0 ? 'بیشتر' : 'کمتر';
    mismatchNote = '⚠ ' + Math.abs(mismatch) + ' TL ' + sign + ' از فیش دریافت شد. ';
  }
  if(nextPending.length > 0){
    toast(mismatchNote + 'ثبت شد. سفارش بعدی: ' + (nextPending[0].name || nextPending[0].address || ''));
  } else {
    toast(mismatchNote + 'همه سفارش‌های صف تحویل داده شدن 🎉');
  }
 }catch(e){
  toast('⚠ خطا: ' + (e && e.message ? e.message : e), true);
  console.error('confirmDelivery error:', e);
 }
}

let receivedPanelVisible = localStorage.getItem('received_panel_visible') !== 'false';

function toggleReceivedPanel(){
  receivedPanelVisible = !receivedPanelVisible;
  localStorage.setItem('received_panel_visible', receivedPanelVisible ? 'true' : 'false');
  renderReceivedPanel();
}

function renderReceivedPanel(){
  const body = document.getElementById('receivedPanelBody');
  const btn = document.getElementById('receivedToggleBtn');
  if(!body) return;

  if(!receivedPanelVisible){
    body.style.display = 'none';
    if(btn) btn.textContent = 'نمایش بده';
    return;
  }
  if(btn) btn.textContent = 'مخفی کن';
  body.style.display = '';

  const delivered = currentOrders.filter(o => o.status === 'delivered');
  let cashTL = 0, cardTotal = 0, transferTotal = 0, tipTotal = 0, onlineTotal = 0;
  const forexByCurrency = {};

  delivered.forEach(o => {
    const payments = getOrderPayments(o);
    const onlinePayment = payments.find(p => p.method === 'آنلاین');
    if(onlinePayment) onlineTotal += Number(onlinePayment.amountTL) || 0;
    payments.forEach(p => {
      if(p.method === 'نقد') cashTL += Number(p.amountTL) || 0;
      else if(p.method === 'کارت') cardTotal += Number(p.amountTL) || 0;
      else if(p.method === 'واریز') transferTotal += Number(p.amountTL) || 0;
      else if(p.method === 'ارز'){
        if(!forexByCurrency[p.currency]) forexByCurrency[p.currency] = { amount: 0, tlEquivalent: 0 };
        forexByCurrency[p.currency].amount += Number(p.currencyAmount) || 0;
        forexByCurrency[p.currency].tlEquivalent += Number(p.tlEquivalent) || 0;
      }
    });
    if(o.changeGiven) cashTL -= Number(o.changeGiven) || 0;
    const mismatch = getOrderMismatch(o);
    if(mismatch > 0) tipTotal += mismatch;
  });

  const forexLines = Object.keys(forexByCurrency).map(code => {
    const f = forexByCurrency[code];
    return `<div class="received-line"><span>ارز — ${escapeHtml(code)}</span><b>${fmt(f.amount)} ${currencySymbol(code)} (≈${fmt(f.tlEquivalent)} TL)</b></div>`;
  }).join('');

  const forexTlTotal = Object.values(forexByCurrency).reduce((s,f) => s + (f.tlEquivalent||0), 0);
  const grandTotal = cashTL + cardTotal + transferTotal + forexTlTotal;

  body.innerHTML = `
    <div class="received-line"><span>نقد (لیر)</span><b>${fmt(cashTL)} TL</b></div>
    ${forexLines}
    <div class="received-line"><span>کارت</span><b>${fmt(cardTotal)} TL</b></div>
    <div class="received-line"><span>واریز به حساب</span><b>${fmt(transferTotal)} TL</b></div>
    ${onlineTotal > 0 ? `<div class="received-line"><span>پرداخت آنلاین (از قبل پرداخت شده)</span><b>${fmt(onlineTotal)} TL</b></div>` : ''}
    ${tipTotal > 0 ? `<div class="received-line" style="color:var(--tip-ink);"><span>💰 تیپ خودکار</span><b>+${fmt(tipTotal)} TL</b></div>` : ''}
    <div class="received-line" style="font-weight:700;border-top:2px solid var(--line);margin-top:4px;padding-top:8px;"><span>جمع کل دریافتی</span><b>${fmt(grandTotal)} TL</b></div>
    <div id="receivedExpenseDeductions"></div>
  `;

  getTodayExpenses().then(expenses => {
    const deductEl = document.getElementById('receivedExpenseDeductions');
    if(!deductEl || expenses.length === 0) return;
    const expensesFromCustomerCash = expenses.filter(e => (e.type||'expense') === 'expense' && e.source === 'مشتری‌ها').reduce((s,e) => s + (Number(e.amount)||0), 0);
    const cashHandedToBox = expenses.filter(e => e.type === 'cashbox_payment').reduce((s,e) => s + (Number(e.amount)||0), 0);
    if(expensesFromCustomerCash <= 0 && cashHandedToBox <= 0) return;
    let html = '';
    if(expensesFromCustomerCash > 0) html += `<div class="received-line"><span>🧾 هزینه از دریافتی مشتری‌ها</span><b>-${fmt(expensesFromCustomerCash)} TL</b></div>`;
    if(cashHandedToBox > 0) html += `<div class="received-line"><span>📤 پرداخت‌شده به صندوق</span><b>-${fmt(cashHandedToBox)} TL</b></div>`;
    html += `<div class="received-line" style="font-weight:700;"><span>خالص نقدی که دستته</span><b>${fmt(cashTL - expensesFromCustomerCash - cashHandedToBox)} TL</b></div>`;
    deductEl.innerHTML = html;
  });
}

function renderReportSheet(orders, dayKey, isToday, isSingleDay){
  if(isSingleDay === undefined) isSingleDay = true;
  const delivered = orders.filter(o => o.status === 'delivered');
  let cashTotal = 0, cardTotal = 0, transferTotal = 0, tipTotal = 0, shortfallTotal = 0;
  const forexTotals = {};
  delivered.forEach(o => {
    getOrderPayments(o).forEach(p => {
      if(p.method === 'نقد') cashTotal += Number(p.amountTL) || 0;
      else if(p.method === 'کارت') cardTotal += Number(p.amountTL) || 0;
      else if(p.method === 'واریز') transferTotal += Number(p.amountTL) || 0;
      else if(p.method === 'ارز'){
        cashTotal += Number(p.tlEquivalent) || 0;
        forexTotals[p.currency] = (forexTotals[p.currency]||0) + (Number(p.currencyAmount)||0);
      }
    });
    if(o.changeGiven) cashTotal -= Number(o.changeGiven) || 0;
    const mismatch = getOrderMismatch(o);
    if(mismatch > 0) tipTotal += mismatch;
    else if(mismatch < 0) shortfallTotal += Math.abs(mismatch);
  });
  const durations = delivered.filter(o => o.deliveryDurationMin != null).map(o => o.deliveryDurationMin);
  const avgDuration = durations.length ? Math.round(durations.reduce((s,d) => s+d, 0) / durations.length) : null;
  const grandTotal = cashTotal + cardTotal + transferTotal;
  const dayLabel = dayKey.replace(STORAGE_KEY_PREFIX,'');
  const reportText = buildReportText(orders, dayLabel, cashTotal, cardTotal, transferTotal, forexTotals, grandTotal, tipTotal, shortfallTotal, avgDuration);

  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="overlay">
    <div class="sheet">
      <div class="sheet-head">
        <h2>گزارش ${isToday ? 'امروز' : dayLabel}</h2>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="report-line"><span>کل سفارش‌ها</span><b>${orders.length}</b></div>
      ${avgDuration != null ? `<div class="report-line"><span>میانگین زمان تحویل</span><b>${avgDuration} دقیقه</b></div>` : ''}
      <div class="report-line"><span>تحویل‌شده</span><b>${delivered.length}</b></div>
      <div class="report-line"><span>نقد</span><b>${fmt(cashTotal)} TL</b></div>
      <div class="report-line"><span>کارت</span><b>${fmt(cardTotal)} TL</b></div>
      <div class="report-line"><span>واریز</span><b>${fmt(transferTotal)} TL</b></div>
      ${tipTotal > 0 ? `<div class="report-line"><span style="color:var(--tip-ink);">💰 تیپ خودکار (از اضافه‌دریافتی‌ها)</span><b style="color:var(--tip-ink);">+${fmt(tipTotal)} TL</b></div>` : ''}
      ${shortfallTotal > 0 ? `<div class="report-line"><span style="color:var(--deficit-ink);">⚠ کسری (کمتر از فیش دریافت شده)</span><b style="color:var(--deficit-ink);">-${fmt(shortfallTotal)} TL</b></div>` : ''}
      <div id="expensesReportLine"></div>
      ${Object.keys(forexTotals).map(k => `<div class="report-line"><span>ارز (${k})</span><b>${fmt(forexTotals[k])}${currencySymbol(k)}</b></div>`).join('')}
      <div class="report-total"><span>مجموع لیر</span><span>${fmt(grandTotal)} TL</span></div>

      <div class="report-txt">${escapeHtml(reportText)}</div>

      <div class="save-bar">
        <button class="cancel" onclick="copyReport()">کپی گزارش</button>
        <button class="save" onclick="exportExcel()">دانلود اکسل</button>
      </div>
      <div class="save-bar">
        <button class="cancel" onclick="shareToDrive()">اشتراک‌گذاری در گوگل درایو</button>
      </div>
      ${isToday ? `<div class="save-bar"><button class="save" style="background:var(--red);color:#fff" onclick="confirmResetDay()">شروع روز جدید</button></div>` : (isSingleDay ? `<div class="save-bar"><button class="save" style="background:var(--red);color:#fff" onclick="confirmDeleteHistoryDay('${dayKey}')">🗑 حذف این روز از تاریخچه</button></div>` : '')}
    </div>
  </div>`;
  window._reportOrders = orders;
  window._reportDayLabel = dayLabel;
  window._reportText = reportText;

  const expenseKey = EXPENSE_KEY_PREFIX + dayKey.replace(STORAGE_KEY_PREFIX, '');
  getExpensesForDay(expenseKey).then(expenses => {
    const el = document.getElementById('expensesReportLine');
    if(!el || expenses.length === 0) return;

    const expensesFromCustomerCash = expenses.filter(e => (e.type||'expense') === 'expense' && e.source === 'مشتری‌ها').reduce((s,e) => s + (Number(e.amount)||0), 0);
    const expensesFromOwnMoney = expenses.filter(e => (e.type||'expense') === 'expense' && (e.source === 'خودم' || !e.source)).reduce((s,e) => s + (Number(e.amount)||0), 0);
    const expensesFromCashbox = expenses.filter(e => (e.type||'expense') === 'expense' && e.source === 'صندوق').reduce((s,e) => s + (Number(e.amount)||0), 0);
    const cashboxIncome = expenses.filter(e => e.type === 'cashbox_income').reduce((s,e) => s + (Number(e.amount)||0), 0);
    const cashHandedToBox = expenses.filter(e => e.type === 'cashbox_payment').reduce((s,e) => s + (Number(e.amount)||0), 0);

    let html = '';
    if(expensesFromCustomerCash > 0) html += `<div class="report-line"><span>🧾 هزینه از پول مشتری‌ها</span><b>-${fmt(expensesFromCustomerCash)} TL</b></div>`;
    if(cashHandedToBox > 0) html += `<div class="report-line"><span>📤 پرداخت‌شده به صندوق (وسط روز)</span><b>-${fmt(cashHandedToBox)} TL</b></div>`;

    el.innerHTML = html;
  });
}

function buildReportText(orders, dayLabel, cashTotal, cardTotal, transferTotal, forexTotals, grandTotal, tipTotal, shortfallTotal, avgDuration){
  let lines = [];
  lines.push('گزارش پیک - ' + dayLabel);
  lines.push('تعداد سفارش: ' + orders.length + ' (تحویل‌شده: ' + orders.filter(o=>o.status==='delivered').length + ')');
  if(avgDuration != null) lines.push('میانگین زمان تحویل: ' + avgDuration + ' دقیقه');
  lines.push('---');
  orders.forEach((o, idx) => {
    const payments = getOrderPayments(o);
    const payTxt = payments.length
      ? payments.map(p => {
          const amtTxt = p.method === 'ارز' ? (fmt(p.currencyAmount) + currencySymbol(p.currency) + (p.tlEquivalent ? (' (≈'+fmt(p.tlEquivalent)+' TL)') : ''))
            : (fmt(p.amountTL) + ' TL');
          return amtTxt + ' [' + p.method + ']';
        }).join(' + ')
      : 'در انتظار';
    const mismatch = getOrderMismatch(o);
    const mismatchTxt = mismatch ? (mismatch > 0 ? ' (تیپ +' + fmt(mismatch) + ' TL)' : ' (کسری ' + fmt(mismatch) + ' TL)') : '';
    const changeTxt = o.changeGiven ? ' | برگشتی: ' + fmt(o.changeGiven) + ' TL' : '';
    const durTxt = o.deliveryDurationMin != null ? ' | ' + o.deliveryDurationMin + ' دقیقه' : '';
    lines.push((idx+1) + '. ' + (o.name || 'بدون نام') + ' | فیش: ' + fmt(o.amount) + ' TL | دریافتی: ' + payTxt + mismatchTxt + changeTxt + durTxt);
  });
  lines.push('---');
  lines.push('نقد: ' + fmt(cashTotal) + ' TL');
  lines.push('کارت: ' + fmt(cardTotal) + ' TL');
  lines.push('واریز: ' + fmt(transferTotal) + ' TL');
  if(tipTotal > 0) lines.push('تیپ خودکار (از اضافه‌دریافتی‌ها): +' + fmt(tipTotal) + ' TL');
  if(shortfallTotal > 0) lines.push('کسری (کمتر از فیش دریافت شده): -' + fmt(shortfallTotal) + ' TL');
  Object.keys(forexTotals).forEach(k => lines.push('ارز ' + k + ': ' + fmt(forexTotals[k]) + currencySymbol(k)));
  lines.push('مجموع لیر: ' + fmt(grandTotal) + ' TL');
  return lines.join('\n');
}

function buildExcelRows(orders){
  return orders.map((o, idx) => {
    const payments = getOrderPayments(o);
    const tlSum = payments.filter(p => p.method !== 'تیپ').reduce((s,p) => {
      if(p.method === 'ارز') return s + (Number(p.tlEquivalent)||0);
      return s + (Number(p.amountTL)||0);
    }, 0) - (Number(o.changeGiven) || 0);
    const mismatch = getOrderMismatch(o);
    const tipSum = mismatch > 0 ? mismatch : 0;
    const shortfallSum = mismatch < 0 ? Math.abs(mismatch) : 0;
    const forexParts = payments.filter(p => p.method === 'ارز').map(p => fmt(p.currencyAmount) + (p.currency||'') + (p.tlEquivalent ? (' (≈'+fmt(p.tlEquivalent)+' TL)') : ''));
    const notesParts = payments.filter(p => p.note).map(p => p.note);
    return {
      'ردیف': idx+1,
      'ساعت سفارش': o.time || '',
      'ساعت تحویل': o.deliveredAt || '',
      'مدت تحویل (دقیقه)': o.deliveryDurationMin != null ? o.deliveryDurationMin : '',
      'وضعیت': o.status === 'delivered' ? 'تحویل‌شده' : o.status === 'cancelled' ? 'کنسل‌شده' : (o.incomplete ? 'ناقص' : 'در صف'),
      'نام مشتری': o.name || '',
      'آدرس': o.address || '',
      'تلفن': o.phone || '',
      'مبلغ فیش (TL)': Number(o.amount) || 0,
      'روش دریافت': payments.map(p => p.method).join(' + '),
      'مبلغ دریافتی (TL)': tlSum || '',
      'برگشتی (TL)': o.changeGiven ? fmt(o.changeGiven) : '',
      'تیپ خودکار (TL)': tipSum || '',
      'کسری (TL)': shortfallSum || '',
      'مبلغ دریافتی (ارز)': forexParts.join(' + '),
      'یادداشت پرداخت': notesParts.join(' | '),
      'منبع سفارش': o.source || '',
      'شماره سفارش': o.orderNo || '',
      'اقلام سفارش': o.items || '',
      'لینک نقشه': o.mapLink || '',
      'یادداشت سفارش': o.notes || ''
    };
  });
}

function exportExcel(){
  const orders = window._reportOrders || [];
  const dayLabel = window._reportDayLabel || 'گزارش';
  if(typeof XLSX === 'undefined'){
    toast('کتابخانه اکسل بارگذاری نشد، اینترنتت رو چک کن');
    return;
  }
  const rows = buildExcelRows(orders);
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:5},{wch:9},{wch:9},{wch:11},{wch:11},{wch:16},{wch:30},{wch:14},{wch:12},{wch:14},{wch:12},{wch:11},{wch:9},{wch:12},{wch:16},{wch:20},{wch:13},{wch:12},{wch:34},{wch:28},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'گزارش');
  XLSX.writeFile(wb, 'peyk-report-' + dayLabel + '.xlsx');
  toast('فایل اکسل دانلود شد');
}

async function shareToDrive(){
  const orders = window._reportOrders || [];
  const dayLabel = window._reportDayLabel || 'گزارش';
  if(typeof XLSX === 'undefined'){
    toast('کتابخانه اکسل بارگذاری نشد، اینترنتت رو چک کن');
    return;
  }
  const rows = buildExcelRows(orders);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'گزارش');
  const arrayBuf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const fileName = 'peyk-report-' + dayLabel + '.xlsx';
  const file = new File([arrayBuf], fileName, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({ files: [file], title: fileName });
    }catch(e){
      if(e.name !== 'AbortError') toast('اشتراک‌گذاری انجام نشد');
    }
  } else {
    toast('اشتراک‌گذاری مستقیم پشتیبانی نمیشه، فایل دانلود شد؛ از گوگل درایو آپلودش کن');
    exportExcel();
  }
}

async function copyReport(){
  try{
    await navigator.clipboard.writeText(window._reportText || '');
    toast('گزارش کپی شد');
  }catch(e){
    toast('کپی نشد، دستی انتخاب کن');
  }
}

function confirmResetDay(){
  const root = document.getElementById('modalRoot');
  root.insertAdjacentHTML('beforeend', `
  <div class="overlay" style="z-index:70;">
    <div class="sheet" style="max-width:400px;border-radius:16px;">
      <p style="font-size:14px;line-height:1.7;">مطمئنی می‌خوای روز جدید رو شروع کنی؟ همه سفارش‌های امروز پاک میشن (گزارش رو اول کپی کن).</p>
      <div class="save-bar">
        <button class="cancel" onclick="closeModal()">انصراف</button>
        <button class="save" style="background:var(--red);color:#fff" onclick="resetDay()">پاک کن</button>
      </div>
    </div>
  </div>`);
}

async function resetDay(){
  currentOrders = [];
  await saveOrders();
  render();
  closeModal();
  toast('روز جدید شروع شد');
}

async function openHistory(){
  window._historySelectedKeys = new Set();
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="overlay">
    <div class="sheet">
      <div class="sheet-head">
        <h2>تاریخچه روزها</h2>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="two-col" style="margin-bottom:6px;">
        <div>
          <label>از تاریخ</label>
          <input type="date" id="histFrom">
        </div>
        <div>
          <label>تا تاریخ</label>
          <input type="date" id="histTo">
        </div>
      </div>
      <div class="save-bar" style="margin-top:8px;">
        <button class="cancel" onclick="applyHistoryFilter()">فیلتر بازه</button>
        <button class="save" onclick="clearHistoryFilter()">پاک کردن فیلتر</button>
      </div>
      <div id="histRangeReportBtn"></div>
      <div id="histBulkDeleteBar" style="display:none;margin-top:8px;">
        <button class="danger" style="width:100%;" onclick="confirmDeleteSelectedHistoryDays()">🗑 حذف موارد انتخاب‌شده (<span id="histSelectedCount">0</span>)</button>
      </div>
      <div id="historyList" style="font-size:13px;color:var(--muted);margin-top:14px;">در حال بارگذاری...</div>
    </div>
  </div>`;

  try{
    const listRes = await idbStore.list(STORAGE_KEY_PREFIX);
    const keys = (listRes && listRes.keys) ? keys_sort(listRes.keys) : [];
    if(keys.length === 0){
      document.getElementById('historyList').innerHTML = '<div class="empty">هنوز روزی ثبت نشده.</div>';
      return;
    }
    const items = await Promise.all(keys.map(async k => {
      try{
        const r = await idbStore.get(k);
        const orders = r ? JSON.parse(r.value) : [];
        let total = 0;
        orders.filter(o=>o.status==='delivered').forEach(o => {
          getOrderPayments(o).forEach(p => {
            if(p.method !== 'ارز') total += Number(p.amountTL) || 0;
          });
        });
        return { key: k, count: orders.length, total, orders };
      }catch(e){
        return { key: k, count: 0, total: 0, orders: [] };
      }
    }));
    window._historyCache = items;
    renderHistoryList(items);
  }catch(e){
    document.getElementById('historyList').innerHTML = '<div class="empty">خطا در بارگذاری تاریخچه.</div>';
  }
}

function keys_sort(keys){
  return keys.slice().sort().reverse();
}

function renderHistoryList(items){
  const listEl = document.getElementById('historyList');
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty">روزی در این بازه پیدا نشد.</div>';
    document.getElementById('histRangeReportBtn').innerHTML = '';
    return;
  }
  listEl.innerHTML = items.map(it => `
    <div class="order">
      <div class="order-body" style="padding:12px 14px;display:flex;gap:10px;">
        <input type="checkbox" ${window._historySelectedKeys && window._historySelectedKeys.has(it.key) ? 'checked' : ''} onchange="toggleHistorySelectDay('${it.key}', this.checked)" style="width:20px;height:20px;margin-top:4px;flex-shrink:0;">
        <div style="flex:1;">
          <div class="order-top" style="cursor:pointer;" onclick='openHistoryDay("${it.key}")'>
            <div class="order-name" style="font-size:14px;">${it.key.replace(STORAGE_KEY_PREFIX,'')}</div>
            <div class="order-amt" style="font-size:16px;">${fmt(it.total)} TL</div>
          </div>
          <div class="order-addr" style="cursor:pointer;" onclick='openHistoryDay("${it.key}")'>${it.count} سفارش</div>
          <div class="order-actions">
            <button class="danger" onclick='confirmDeleteHistoryDay("${it.key}")'>🗑 حذف این روز از تاریخچه</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  const rangeBtnHolder = document.getElementById('histRangeReportBtn');
  if(rangeBtnHolder) rangeBtnHolder.innerHTML = '';
}

function applyHistoryFilter(){
  const from = document.getElementById('histFrom').value;
  const to = document.getElementById('histTo').value;
  const all = window._historyCache || [];
  const filtered = all.filter(it => {
    const d = it.key.replace(STORAGE_KEY_PREFIX,'');
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  });
  renderHistoryList(filtered);
}

function clearHistoryFilter(){
  document.getElementById('histFrom').value = '';
  document.getElementById('histTo').value = '';
  renderHistoryList(window._historyCache || []);
}

function confirmDeleteHistoryDay(key){
  const root = document.getElementById('modalRoot');
  const label = key.replace(STORAGE_KEY_PREFIX,'');
  root.insertAdjacentHTML('beforeend', `
  <div class="overlay" style="z-index:70;">
    <div class="sheet" style="max-width:400px;border-radius:16px;">
      <p style="font-size:14px;line-height:1.7;">مطمئنی می‌خوای گزارش روز ${escapeHtml(label)} رو کامل حذف کنی؟ این کار برگشت‌پذیر نیست.</p>
      <div class="save-bar">
        <button class="cancel" onclick="closeDuplicateConfirm()">انصراف</button>
        <button class="save" style="background:var(--red);color:#fff" onclick="deleteHistoryDay('${key}')">حذف کن</button>
      </div>
    </div>
  </div>`);
}

async function deleteHistoryDay(key){
  await idbStore.delete(key);
  window._historyCache = (window._historyCache || []).filter(it => it.key !== key);
  closeModal();
  if(key === todayKey()){
    currentOrders = [];
    render();
  }
  toast('حذف شد');
}

function toggleHistorySelectDay(key, checked){
  if(!window._historySelectedKeys) window._historySelectedKeys = new Set();
  if(checked) window._historySelectedKeys.add(key);
  else window._historySelectedKeys.delete(key);
  const bar = document.getElementById('histBulkDeleteBar');
  const countEl = document.getElementById('histSelectedCount');
  const count = window._historySelectedKeys.size;
  if(countEl) countEl.textContent = count;
  if(bar) bar.style.display = count > 0 ? 'block' : 'none';
}

function confirmDeleteSelectedHistoryDays(){
  const count = (window._historySelectedKeys || new Set()).size;
  if(count === 0) return;
  const root = document.getElementById('modalRoot');
  root.insertAdjacentHTML('beforeend', `
  <div class="overlay" style="z-index:70;">
    <div class="sheet" style="max-width:400px;border-radius:16px;">
      <p style="font-size:14px;line-height:1.7;">مطمئنی می‌خوای گزارش ${count} روز انتخاب‌شده رو کامل حذف کنی؟ این کار برگشت‌پذیر نیست.</p>
      <div class="save-bar">
        <button class="cancel" onclick="closeDuplicateConfirm()">انصراف</button>
        <button class="save" style="background:var(--red);color:#fff" onclick="deleteSelectedHistoryDays()">حذف همه</button>
      </div>
    </div>
  </div>`);
}

async function deleteSelectedHistoryDays(){
  const keys = Array.from(window._historySelectedKeys || []);
  let touchedToday = false;
  for(const key of keys){
    await idbStore.delete(key);
    if(key === todayKey()) touchedToday = true;
  }
  window._historyCache = (window._historyCache || []).filter(it => !window._historySelectedKeys.has(it.key));
  window._historySelectedKeys = new Set();
  closeModal();
  if(touchedToday){
    currentOrders = [];
    render();
  }
  toast(keys.length + ' روز حذف شد');
}

function openHistoryDay(key){
  const item = (window._historyCache || []).find(x => x.key === key);
  if(!item) return;
  const isToday = key === todayKey();
  renderReportSheet(item.orders, key, isToday);
}

document.getElementById('addBtnCamera').addEventListener('click', () => { document.getElementById('newOrderCameraInput').click(); });
document.getElementById('addBtnGallery').addEventListener('click', () => { document.getElementById('newOrderGalleryInput').click(); });
document.getElementById('addBtnManual').addEventListener('click', () => { openOrderModal(null); });
document.getElementById('historyBtn').addEventListener('click', openHistory);
document.getElementById('expensesBtn').addEventListener('click', openExpensesManager);
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('locationsBtn').addEventListener('click', openLocationsManager);

function handleIncomingShare(){
  const params = new URLSearchParams(location.search);
  const sharedText = params.get('shared_text') || params.get('shared_url') || '';
  if(!sharedText) return;
  history.replaceState({}, '', location.pathname);

  openLocationsManager();
  openLocationForm(null);
  const looksLikeLink = /https?:\/\/\S+|(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/.test(sharedText);
  if(looksLikeLink){
    window._locFormMapLink = mapUrlFor(sharedText);
    const s = document.getElementById('locMapLinkStatus');
    if(s){ s.textContent = 'لینک نقشه از واتس‌اپ ثبت شد ✓'; s.style.color = 'var(--teal)'; }
    toast('لوکیشن از واتس‌اپ دریافت شد — یه اسم بذار و ذخیره کن');
  } else {
    const addrField = document.getElementById('loc_address');
    if(addrField) addrField.value = sharedText;
    toast('متن از واتس‌اپ دریافت شد، بررسی کن');
  }
}

window.addEventListener('unhandledrejection', (event) => {
  console.error('Unhandled error:', event.reason);
  const msg = (event.reason && event.reason.message) || String(event.reason);
  if(msg && msg.toLowerCase().includes('quota')){
    toast('⚠ حافظه‌ی گوشی پر شده! برو تنظیمات → پاکسازی عکس‌های قدیمی', true);
  } else {
    toast('⚠ خطا: ' + msg, true);
  }
});

console.log('پیک سوشین - نسخه', APP_VERSION);
let _loadedDayKey = todayKey();
loadOrders();
handleIncomingShare();

setInterval(() => {
  const modalOpen = (document.getElementById('modalRoot') || {}).innerHTML;
  if(!modalOpen){
    if(todayKey() !== _loadedDayKey){
      _loadedDayKey = todayKey();
      loadOrders();
    } else {
      render();
    }
  }
}, 60000);

if('serviceWorker' in navigator && window.isSecureContext){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // silently ignore — offline caching is a nice-to-have, not required for the app to work
    });
  });
}

let backExitArmed = false;
let backExitTimer = null;

function pushBackGuard(){
  try{ history.pushState({ peykGuard: true }, '', location.href); }catch(e){}
}

function hasOpenOverlay(){
  return !!(document.getElementById('qrScanOverlay') || document.getElementById('lightboxOverlay') ||
    (document.getElementById('modalRoot') && document.getElementById('modalRoot').innerHTML.trim() !== ''));
}

function closeTopmostOverlay(){
  if(document.getElementById('qrScanOverlay')){ stopQrScanner(); return; }
  if(document.getElementById('lightboxOverlay')){ closeLightbox(); return; }
  const overlays = document.querySelectorAll('#modalRoot .overlay, #modalRoot .qr-scan-overlay');
  if(overlays.length > 1){
    overlays[overlays.length - 1].remove();
  } else if(overlays.length === 1){
    closeModal();
  }
}

window.addEventListener('popstate', () => {
  if(hasOpenOverlay()){
    closeTopmostOverlay();
    pushBackGuard();
    return;
  }
  if(backExitArmed){
    return; // second back press within the window — let it actually exit
  }
  backExitArmed = true;
  toast('برای خروج از برنامه، دوباره دکمه برگشت رو بزن');
  if(backExitTimer) clearTimeout(backExitTimer);
  backExitTimer = setTimeout(() => { backExitArmed = false; }, 2000);
});

pushBackGuard();
</script>
